<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Iron.Log</title>
<meta name="theme-color" content="#0B0F18">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iron.Log">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0F18;
    --surface:#131A28;
    --surface-2:#1B2436;
    --hair:rgba(150,180,220,.10);
    --hair-strong:rgba(150,180,220,.20);
    --chalk:#EDF2FA;
    --muted:#94A3BC;
    --muted-dim:#5C6B85;
    --amber:#27E1C1;
    --amber-soft:rgba(39,225,193,.13);
    --amber-line:rgba(39,225,193,.45);
    --steel:#6F8BD6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--chalk);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    line-height:1.4;
    padding-bottom:calc(96px + env(safe-area-inset-bottom, 0px));
    overscroll-behavior-y:contain;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 16px}

  /* Header */
  header{
    padding:calc(26px + env(safe-area-inset-top, 0px)) 0 14px;
    border-bottom:1px solid var(--hair);
    margin-bottom:18px;
  }
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand h1{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    font-size:30px;line-height:.9;margin:0;
  }
  .brand h1 .x{color:var(--amber)}
  .brand .tag{
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--muted-dim);font-weight:600;
  }
  .sub{margin-top:8px;font-size:13px;color:var(--muted)}

  /* Day toggle */
  .daypick{display:flex;gap:8px;margin:18px 0 6px}
  .daypick button{
    flex:1;background:var(--surface);color:var(--muted);
    border:1px solid var(--hair);border-radius:12px;
    padding:12px 10px;cursor:pointer;text-align:left;
    transition:border-color .15s,background .15s,color .15s;
  }
  .daypick button .lab{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;
    text-transform:uppercase;letter-spacing:.05em;font-size:18px;line-height:1;
  }
  .daypick button .desc{display:block;font-size:11px;margin-top:3px;color:var(--muted-dim)}
  .daypick button.on{
    background:var(--amber-soft);border-color:var(--amber-line);color:var(--chalk);
  }
  .daypick button.on .desc{color:var(--muted)}

  .typepick{display:none;gap:7px;overflow-x:auto;padding:10px 0 2px;-webkit-overflow-scrolling:touch}
  .typepick.show{display:flex}
  .typechip{
    flex:0 0 auto;background:var(--surface);border:1px solid var(--hair);color:var(--muted);
    border-radius:999px;padding:8px 14px;font-family:'Inter';font-size:12.5px;font-weight:600;cursor:pointer;
    white-space:nowrap;
  }
  .typechip.on{background:var(--amber);color:#04231e;border-color:var(--amber)}

  .planbanner{
    background:var(--amber-soft);border:1px solid var(--amber-line);
    border-radius:13px;padding:13px 15px;margin:4px 0 2px;
  }

  .resttimer{
    position:fixed;left:16px;bottom:calc(96px + env(safe-area-inset-bottom, 0px));z-index:35;
    background:var(--surface-2);border:1px solid var(--amber-line);color:var(--amber);
    border-radius:11px;padding:10px 16px;cursor:pointer;
    font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.04em;
    font-size:16px;font-variant-numeric:tabular-nums;display:none;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .resttimer.show{display:block}
  .resttimer.done{color:#04231e;background:var(--amber)}
  .planbanner.hidden{display:none}
  .pb-title{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;
    letter-spacing:.05em;font-size:17px;color:var(--amber);line-height:1;
  }
  .pb-why{font-size:12.5px;color:var(--chalk);margin-top:7px;line-height:1.45;opacity:.92}
  .pb-why b{color:var(--amber);font-weight:600}

  .meta-row{display:flex;align-items:center;justify-content:space-between;margin:14px 0 4px}
  .meta-row .week{font-size:13px;color:var(--muted)}
  .datefield{
    background:var(--surface);border:1px solid var(--hair);color:var(--chalk);
    border-radius:9px;padding:7px 10px;font-family:'Inter';font-size:13px;
  }

  /* Exercise card */
  .ex{
    background:var(--surface);border:1px solid var(--hair);
    border-radius:14px;padding:14px 14px 6px;margin-bottom:12px;
  }
  .ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
  .ex-name{
    font-family:'Barlow Condensed',sans-serif;font-weight:600;
    font-size:21px;letter-spacing:.01em;line-height:1;margin:0;cursor:pointer;
  }
  .info-i{font-size:13px;color:var(--muted-dim);vertical-align:middle}
  .info-cue{background:var(--surface-2);border:1px solid var(--hair);border-radius:11px;padding:12px 13px;margin-top:14px;font-size:13.5px;line-height:1.5;color:var(--chalk)}
  .info-cue-l{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-dim);font-weight:700;margin-bottom:5px}
  .ex-target{
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted-dim);font-weight:600;margin-top:5px;
  }
  .last{
    text-align:right;flex-shrink:0;min-width:74px;
  }
  .last .k{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-dim);font-weight:600}
  .last .v{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;
    line-height:1;color:var(--muted);font-variant-numeric:tabular-nums;
  }
  .last .v.none{color:var(--muted-dim);font-size:15px}

  .sug{
    display:inline-block;margin-top:9px;border:1px solid var(--hair-strong);
    background:var(--surface-2);color:var(--muted);border-radius:999px;
    padding:6px 12px;font-family:'Inter';font-size:12px;font-weight:600;
    cursor:pointer;letter-spacing:.01em;transition:border-color .15s,color .15s,background .15s;
  }
  .sug:active{transform:scale(.97)}
  .sug.up{color:var(--amber);border-color:var(--amber-line);background:var(--amber-soft)}
  .sug.hold{color:var(--steel);border-color:rgba(111,139,214,.4)}
  .sug.repeat{color:var(--muted)}
  .sug.base{cursor:default;color:var(--muted-dim)}

  .ex-right{display:flex;align-items:flex-start;gap:8px}
  .ex-btns{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
  .swapbtn{
    background:none;border:1px solid var(--hair);color:var(--muted-dim);
    width:30px;height:30px;border-radius:8px;font-size:15px;line-height:1;cursor:pointer;
  }
  .swapbtn:active{color:var(--amber);border-color:var(--amber-line)}
  .infobtn{
    background:var(--amber-soft);border:1px solid var(--amber-line);color:var(--amber);
    width:30px;height:30px;border-radius:8px;font-size:15px;line-height:1;cursor:pointer;
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-style:italic;
  }
  .infobtn:active{background:var(--amber);color:#04231e}
  .swaptray{
    display:flex;flex-wrap:wrap;gap:7px;align-items:center;
    background:var(--surface-2);border:1px solid var(--hair);border-radius:11px;
    padding:10px 11px;margin:0 0 12px;
  }
  .swaptray-l{font-size:11px;color:var(--muted);font-weight:600;width:100%;margin-bottom:2px}
  .swapchip{
    background:var(--surface);border:1px solid var(--hair-strong);color:var(--chalk);
    border-radius:999px;padding:7px 12px;font-family:'Inter';font-size:12px;font-weight:600;cursor:pointer;
  }
  .swapchip:active{background:var(--amber-soft);border-color:var(--amber-line);color:var(--amber)}
  .swapchip.cancel{color:var(--muted-dim);border-style:dashed}
  .rm{
    background:none;border:1px solid var(--hair);color:var(--muted-dim);
    width:30px;height:30px;border-radius:8px;font-size:18px;line-height:1;cursor:pointer;
    flex:0 0 auto;
  }
  .rm:active{color:var(--amber);border-color:var(--amber-line)}
  .addset{
    background:none;border:none;color:var(--muted-dim);cursor:pointer;
    font-family:'Inter';font-size:12px;font-weight:600;letter-spacing:.04em;
    padding:8px 2px 4px;
  }
  .addset:active{color:var(--amber)}
  .ex-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .restbtn{
    background:none;border:1px solid var(--hair);color:var(--muted);cursor:pointer;
    font-family:'Inter';font-size:12px;font-weight:600;letter-spacing:.02em;
    padding:7px 12px;border-radius:9px;margin:4px 0;
  }
  .restbtn:active{color:var(--amber);border-color:var(--amber-line)}
  .savelift{
    background:var(--surface-2);border:1px solid var(--hair-strong);color:var(--chalk);cursor:pointer;
    font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    font-size:14px;padding:8px 16px;border-radius:9px;margin:4px 0;
  }
  .savelift:active{transform:scale(.97)}
  .savelift.done{background:var(--amber-soft);border-color:var(--amber-line);color:var(--amber)}
  .ex.saved{border-color:var(--amber-line)}

  .sug.reset,.sug.swap{color:#F2B266;border-color:rgba(242,178,102,.45);background:rgba(242,178,102,.08)}
  .effort{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
  .effort-l{width:100%;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-dim);font-weight:600}
  .effchip{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--hair);color:var(--muted);
    border-radius:9px;padding:6px 4px;cursor:pointer;font-family:'Inter';line-height:1.2;text-align:center}
  .effchip b{display:block;font-size:12.5px;font-weight:600}
  .effchip small{display:block;font-size:10px;color:var(--muted-dim)}
  .effchip.on{background:var(--amber-soft);border-color:var(--amber-line);color:var(--amber)}
  .effchip.on small{color:var(--amber);opacity:.8}
  .pb-btn{margin-top:10px;background:none;border:1px solid var(--amber-line);color:var(--amber);border-radius:9px;
    padding:7px 12px;font-family:'Inter';font-size:12px;font-weight:600;cursor:pointer}
  .pb-btn.hot{background:var(--amber);color:#04231e}
  .stepchips{display:flex;flex-wrap:wrap;gap:6px}
  .syfld input{font-family:'Inter'!important;font-size:14px!important;font-weight:500!important}
  .syncstat{font-size:12px;color:var(--muted-dim);margin-top:8px;line-height:1.4;text-align:center}
  .syncstat.err{color:#F2B266}

  /* recap modal */
  .modal{
    position:fixed;inset:0;z-index:60;display:none;
    background:rgba(8,6,4,.72);backdrop-filter:blur(3px);
    align-items:flex-end;justify-content:center;padding:0;
  }
  .modal.show{display:flex}
  .modal-card{
    width:100%;max-width:560px;background:var(--surface);
    border:1px solid var(--hair-strong);border-bottom:none;
    border-radius:20px 20px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom));
    max-height:88vh;overflow-y:auto;animation:rcup .28s ease;
  }
  @keyframes rcup{from{transform:translateY(40px);opacity:.4}to{transform:translateY(0);opacity:1}}
  .rc-h{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:24px;line-height:1}
  .rc-h .x{color:var(--amber)}
  .rc-sub{font-size:13px;color:var(--muted);margin-top:4px}
  .rc-stats{display:flex;gap:10px;margin:16px 0 6px}
  .rc-stats > div{flex:1;background:var(--surface-2);border:1px solid var(--hair);border-radius:12px;padding:12px 10px;text-align:center}
  .rc-n{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
  .rc-k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-dim);font-weight:600;margin-top:5px}
  .rc-lifts{margin-top:12px}
  .rc-lift{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--hair);font-size:13px}
  .rc-lift:first-child{border-top:none}
  .rc-lift > span:first-child{color:var(--chalk)}
  .rc-lift > span:last-child{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:14px;text-align:right;white-space:nowrap}
  .rc-up{color:var(--amber)} .rc-down{color:var(--muted)} .rc-same{color:var(--muted)} .rc-new{color:var(--steel)}
  .rc-notes{margin:14px 0 4px;display:flex;flex-direction:column;gap:8px}
  .rc-note{background:var(--amber-soft);border:1px solid var(--amber-line);border-radius:11px;padding:11px 13px;font-size:13px;line-height:1.45;color:var(--chalk)}
  .modal-card .btn-primary{width:100%;margin-top:18px}
  .addlift{
    border:1px dashed var(--hair-strong);border-radius:14px;padding:14px;margin-top:4px;
  }
  .addlift-row{display:flex;gap:8px}
  .addlift select{
    flex:1;background:var(--surface-2);color:var(--chalk);border:1px solid var(--hair);
    border-radius:10px;padding:12px 10px;font-family:'Inter';font-size:14px;outline:none;
  }
  .addlift .addbtn{
    background:var(--surface-2);color:var(--chalk);border:1px solid var(--hair-strong);
    border-radius:10px;padding:0 18px;cursor:pointer;
    font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;
    letter-spacing:.05em;font-size:15px;
  }
  .addlift .addbtn:active{transform:scale(.97)}
  .addlift #customname{
    width:100%;margin-top:8px;background:var(--surface-2);color:var(--chalk);
    border:1px solid var(--hair);border-radius:10px;padding:12px 11px;
    font-family:'Inter';font-size:14px;outline:none;
  }
  .addlift #customname:focus{border-color:var(--amber-line)}

  .reset{
    display:block;width:100%;margin-top:16px;background:none;
    border:1px solid var(--hair);color:var(--muted-dim);border-radius:11px;
    padding:13px;cursor:pointer;font-family:'Inter';font-size:13px;font-weight:600;
    letter-spacing:.04em;
  }
  .reset:active{color:#ff5a5a;border-color:rgba(255,90,90,.4)}
  .buildtag{text-align:center;color:var(--muted-dim);font-size:10px;letter-spacing:.08em;margin-top:16px}
  .imphint{display:none;background:var(--amber-soft);border:1px solid var(--amber-line);border-radius:11px;padding:12px 14px;margin-top:14px;font-size:13px;color:var(--chalk);line-height:1.45}
  .imphint.show{display:block}
  .databtns{display:flex;gap:8px;margin-top:14px}
  .databtn{
    flex:1;background:var(--surface);border:1px solid var(--hair);color:var(--muted);
    border-radius:11px;padding:13px;cursor:pointer;font-family:'Inter';font-size:13px;font-weight:600;
    letter-spacing:.02em;
  }
  .databtn:active{color:var(--amber);border-color:var(--amber-line)}
  .dm-h{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:20px}
  .dm-sub{font-size:13px;color:var(--muted);margin:6px 0 12px;line-height:1.45}
  .dm-ta{
    width:100%;min-height:120px;background:var(--bg);border:1px solid var(--hair);color:var(--chalk);
    border-radius:10px;padding:11px;font-family:ui-monospace,Menlo,monospace;font-size:11px;
    outline:none;resize:vertical;
  }
  .dm-ta:focus{border-color:var(--amber-line)}
  .dm-row{display:flex;gap:8px;margin-top:12px}
  .dm-row .btn{flex:1;margin-top:0}
  .dm-file{display:block;margin-top:10px;font-size:12px;color:var(--muted)}

  /* activity form */
  .actform{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:14px}
  .fld{display:block;margin-bottom:12px}
  .fld:last-child{margin-bottom:0}
  .fld-l{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-dim);font-weight:700;margin-bottom:6px}
  .fld-l em{font-style:normal;color:var(--muted-dim);opacity:.7;letter-spacing:.04em}
  .fld select,.fld input,.actcustom{
    width:100%;background:var(--surface-2);border:1px solid var(--hair);color:var(--chalk);
    border-radius:10px;padding:12px 11px;font-family:'Inter';font-size:15px;outline:none;
  }
  .fld input{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:19px}
  .fld select:focus,.fld input:focus,.actcustom:focus{border-color:var(--amber-line)}
  .actcustom{margin:-4px 0 12px}
  .fld-row{display:flex;gap:10px}
  .fld-row .fld{flex:1}
  .hrow.act b{color:var(--amber)}

  /* set rows */
  .set{
    display:grid;grid-template-columns:30px 1fr 1fr;gap:8px;align-items:center;
    padding:6px 0;border-top:1px solid var(--hair);
  }
  .set:first-of-type{border-top:none}
  .set .sn{
    font-family:'Barlow Condensed',sans-serif;font-weight:600;color:var(--muted-dim);
    font-size:15px;text-align:center;background:none;border:none;padding:10px 0;cursor:pointer;width:100%;
  }
  .set.wu .sn{color:var(--steel)}
  .set.wu .inp input{opacity:.5}
  .inp{position:relative}
  .inp input{
    width:100%;background:var(--surface-2);border:1px solid var(--hair);
    color:var(--chalk);border-radius:10px;padding:11px 30px 11px 11px;
    font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:19px;
    font-variant-numeric:tabular-nums;outline:none;transition:border-color .15s;
  }
  .inp input:focus{border-color:var(--amber-line)}
  .inp .unit{
    position:absolute;right:10px;top:50%;transform:translateY(-50%);
    font-size:11px;color:var(--muted-dim);font-weight:600;pointer-events:none;
    letter-spacing:.04em;
  }
  .colhdr{
    display:grid;grid-template-columns:30px 1fr 1fr;gap:8px;
    font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted-dim);font-weight:600;padding:0 0 4px;
  }
  .colhdr span:nth-child(1){text-align:center}
  .colhdr span{padding-left:2px}

  /* save bar */
  .savebar{
    position:fixed;bottom:0;left:0;right:0;
    background:linear-gradient(to top,var(--bg) 62%,transparent);
    padding:14px 16px calc(18px + env(safe-area-inset-bottom, 0px));z-index:20;
  }
  .savebar .inner{max-width:560px;margin:0 auto;display:flex;gap:10px}
  .btn{
    border:none;border-radius:13px;padding:15px;cursor:pointer;
    font-family:'Barlow Condensed',sans-serif;font-weight:700;
    text-transform:uppercase;letter-spacing:.06em;font-size:17px;
    transition:transform .08s,filter .15s;
  }
  .btn:active{transform:scale(.98)}
  .btn-primary{flex:1;background:var(--amber);color:#04231e}
  .btn-primary:hover{filter:brightness(1.06)}
  .btn-ghost{
    background:var(--surface);color:var(--muted);border:1px solid var(--hair);
    flex:0 0 auto;padding-left:20px;padding-right:20px;
  }

  /* tabs */
  .tabs{display:flex;gap:24px;border-bottom:1px solid var(--hair);margin-bottom:18px}
  .tabs button{
    background:none;border:none;color:var(--muted-dim);cursor:pointer;
    font-family:'Barlow Condensed',sans-serif;font-weight:600;text-transform:uppercase;
    letter-spacing:.08em;font-size:16px;padding:0 0 12px;position:relative;
  }
  .tabs button.on{color:var(--chalk)}
  .tabs button.on::after{
    content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--amber);
  }

  /* progress */
  .pex{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:14px;margin-bottom:12px}
  .pex-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:10px}
  .pex-name{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:20px;margin:0}
  .pstats{display:flex;gap:18px}
  .stat .k{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-dim);font-weight:600}
  .stat .v{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;line-height:1.05;font-variant-numeric:tabular-nums}
  .stat .v small{font-size:12px;color:var(--muted);font-weight:600}

// across launches and across app updates. Inside Claude, the native store is used.
if(!window.storage){
  window.storage = {
    get:    async (k)   => { try{ const v = localStorage.getItem(k); return v==null ? null : {value:v}; }catch(e){ return null; } },
    set:    async (k,v) => { try{ localStorage.setItem(k, v); }catch(e){} return {value:v}; },
    delete: async (k)   => { try{ localStorage.removeItem(k); }catch(e){} return {deleted:true}; },
  };
}
// Service worker: always fetch the latest version when online (so app updates show
// up without cache-busting), fall back to cache when offline. Harmless in Claude.
try{

}catch(e){}

// keyed lookup + derived display reps; EXDEF kept as the name used elsewhere

LIBRARY.forEach(e=>{

  EXDEF[e.id] = e;

const NAMES = {}; LIBRARY.forEach(e=> NAMES[e.id]=e.name);
const PATTERN = {}; LIBRARY.forEach(e=> PATTERN[e.id]=e.cat);

// candidate ids per category, ordered compound → accessory → iso
const ROLE_RANK = {compound:0, accessory:1, iso:2};
const CAND = {};
LIBRARY.forEach(e=>{ (CAND[e.cat]=CAND[e.cat]||[]).push(e.id); });
Object.values(CAND).forEach(arr=> arr.sort((a,b)=> ROLE_RANK[EXDEF[a].role]-ROLE_RANK[EXDEF[b].role]));

const CAT_ORDER = ['knee','hinge','calf','hpush','vpush','hpull','vpull','biceps','triceps','core'];
const CAT_LABEL = {knee:'Legs · quads',hinge:'Legs · hamstrings & glutes',calf:'Calves',hpush:'Chest',vpush:'Shoulders',hpull:'Back · rows',vpull:'Back · pulldowns/pull-ups',biceps:'Biceps',triceps:'Triceps',core:'Core'};

const HIGH_FATIGUE = new Set(['dead','trapdl','squat','fsquat','goodmorn']);

};
// one concise form cue per exercise
const CUES = {

// activity (non-lifting) options
const ACTIVITIES = ['Run','Walk','Cycle','Swim','Squash','Tennis','Football','Rowing','Hike','Climbing','Yoga / mobility','Other'];

// ── Single balanced full-body scheme (sets / reps / rest by role) ───────────
const SCHEME = {
  compound:{sets:3, lo:6,  hi:10, rest:120},
  accessory:{sets:3, lo:10, hi:12, rest:90},
  iso:{sets:3, lo:12, hi:15, rest:75},
};
function roleOf(ex){ return (ex && ex.role) || 'accessory'; }
function gcfg(ex){ return SCHEME[roleOf(ex)] || SCHEME.accessory; }
// Sets are trimmed by one while you're easing back in after time off.
function effSets(ex){
  const n = gcfg(ex).sets;
  return returnMode ? Math.max(2, n-1) : n;
}
// Each lift's own rep range (e.g. deadlift 4–6) wins; the scheme is the fallback
// for custom lifts. Sets and rest still come from the scheme.
function effLo(ex){ return (ex && ex.lo) || gcfg(ex).lo; }
function effHi(ex){ return (ex && ex.hi) || gcfg(ex).hi; }
function effInc(ex){ return ex.inc || 2.5; }
function fmtRest(s){ return s>=60 ? (s%60===0 ? (s/60)+' min' : Math.floor(s/60)+':'+String(s%60).padStart(2,'0')) : s+' sec'; }
function repsLabel(ex){ const c=gcfg(ex), lo=effLo(ex), hi=effHi(ex); return `${effSets(ex)} × ${lo}${hi!==lo?'–'+hi:''} · rest ${fmtRest(c.rest)}`; }

let NAMES_REG = {};                 // custom lift id -> display name
function getName(id){ return NAMES[id] || NAMES_REG[id] || id; }

let currentDay = 'N';               // 'N' = auto next session, 'C' = custom, 'X' = activity
let workList = [];                  // lifts for the current session, in order
let currentPlanTitle = '';          // label for an auto-generated session

let currentPlanSlot = null;         // 'A' / 'B' for block sessions
let pendingEffort = {};             // effort taps for the current session, by lift
let PREFS = {inc:{}, updated:0};    // per-lift weight steps
let BLOCK = null;                   // current training block (fixed main lifts)
let TOMB = {};                      // deleted session ids -> deletedAt (so sync doesn't resurrect them)
let SYNC = null;                    // GitHub sync config
let activeDraft = null;             // in-progress session saved lift-by-lift
let sessions = [];

const KEY  = 'ironlog-sessions-v1';
const NKEY = 'ironlog-names-v1';
const PKEY = 'ironlog-prefs-v1';
const BKEY = 'ironlog-block-v1';
const TKEY = 'ironlog-deleted-v1';
const SKEY = 'ironlog-sync-v1';

// Completed sessions only. The in-progress draft lives in `sessions` so it
// survives a reload, but it must never count as "last time" — otherwise saving
// one lift mid-workout rewrites the plan, the suggestions and layoff mode.
function doneSessions(){ return sessions.filter(s=> !s.draft); }

async function loadJSON(k, dflt){
  try{ const r = await window.storage.get(k); return r && r.value ? JSON.parse(r.value) : dflt; }
  catch(e){ return dflt; }
}
async function loadSessions(){
  sessions  = await loadJSON(KEY, []);
  NAMES_REG = await loadJSON(NKEY, {});
  PREFS     = await loadJSON(PKEY, {inc:{}, updated:0}); PREFS.inc = PREFS.inc || {};
  BLOCK     = await loadJSON(BKEY, null);
  TOMB      = await loadJSON(TKEY, {});
  SYNC      = await loadJSON(SKEY, null);
}
async function persist(){
  try{
    await window.storage.set(KEY, JSON.stringify(sessions));
    await window.storage.set(NKEY, JSON.stringify(NAMES_REG));
    await window.storage.set(PKEY, JSON.stringify(PREFS));
    await window.storage.set(BKEY, JSON.stringify(BLOCK));
    await window.storage.set(TKEY, JSON.stringify(TOMB));
  }catch(e){ toast('Save failed — try again'); }
}

// most recent prior session containing this exercise → its heaviest set
// Working sets only: anything tapped as a warm-up, or under 60% of the heaviest
// set, is ignored for progression, volume and PRs (e.g. a 20 kg × 20 bench warm-up).
function workSets(sets){
  if(!sets || !sets.length) return [];
  const real = sets.filter(s=> !s.wu);
  const top = Math.max(0, ...real.map(s=> s.w||0));
  const ws = top > 0 ? real.filter(s=> (s.w||0) >= 0.6*top) : real;
  return ws.length ? ws : sets;
}
function sessionsWith(exId){
  return doneSessions().filter(s=> s.entries && s.entries[exId] && s.entries[exId].length);
}
// most recent prior session containing this exercise → its best working set
function lastTopSet(exId, beforeDate){
  const prior = sessionsWith(exId)
    .filter(s => !beforeDate || s.date < beforeDate)
    .sort((a,b)=> b.date.localeCompare(a.date) || b.id-a.id);
  if(!prior.length) return null;
  const ex = EXDEF[exId];
  return topOf(prior[0].entries[exId], !!(ex && ex.bw));
}
// last session's working sets + how it felt
function lastEntry(exId){
  const prior = sessionsWith(exId).sort((a,b)=> b.date.localeCompare(a.date) || b.id-a.id);
  if(!prior.length) return null;
  const s = prior[0];
  return {sets: workSets(s.entries[exId]), effort: (s.effort && s.effort[exId]) || null, date: s.date};
}
// effort ratings, most recent first
function effortTrail(exId, k){
  return sessionsWith(exId).sort((a,b)=> b.date.localeCompare(a.date) || b.id-a.id)
    .slice(0, k||2).map(s=> (s.effort && s.effort[exId]) || null);
}
// chronological per-session summary: heaviest working weight + best estimated 1RM
function seriesFor(exId){
  const ex = EXDEF[exId];
  return sessionsWith(exId).sort((a,b)=> a.date.localeCompare(b.date) || a.id-b.id).map(s=>{
    const ws = workSets(s.entries[exId]);
    const t = topOf(ws, !!(ex && ex.bw));
    return {date:s.date, id:s.id, topW: Math.max(...ws.map(x=> x.w||0)), e: epley(t.w, t.r), w:t.w, r:t.r};
  });
}

// last full set list for an exercise (most recent session)
function lastSets(exId){ const e = lastEntry(exId); return e ? e.sets : null; }

// chronological top sets for an exercise across recent sessions
function recentTops(exId, bw, k){
  const ss = doneSessions()
    .filter(s => s.entries && s.entries[exId] && s.entries[exId].length)
    .sort((a,b)=> a.date.localeCompare(b.date) || a.id-b.id)
    .slice(-(k||5))
    .map(s=> topOf(s.entries[exId], bw));
  return ss;
}
function epley(w, r){ return w * (1 + Math.min(r,15)/30); }   // estimated 1-rep max

// ── Layoff / return-to-training ─────────────────────────────────────────────
// Set whenever the last lifting session is 14+ days behind the planned date.
// Carries the gap and a per-group retention score earned from activities logged
// in between, so a runner's legs are treated differently to their bench.
let returnMode = null;

function daysSince(dateStr){
  if(!dateStr) return null;
  const planned = (document.getElementById('sessdate') || {}).value || todayStr();
  const d = Math.round((new Date(planned+'T00:00:00') - new Date(dateStr+'T00:00:00'))/86400000);
  return d < 0 ? 0 : d;
}
function lastDateFor(exId){
  const prior = doneSessions()
    .filter(s=> s.entries && s.entries[exId] && s.entries[exId].length)
    .sort((a,b)=> b.date.localeCompare(a.date));
  return prior.length ? prior[0].date : null;
}
function bestEver(exId){
  let b = 0;
  doneSessions().forEach(s=> workSets((s.entries||{})[exId]).forEach(st=>{ if(st.w>b) b=st.w; }));
  return b;
}
// ── Real weight steps ───────────────────────────────────────────────────────
// Per-lift override (set in the ⓘ panel), else the library default. Suggestions
// also snap to weights you've actually logged, so cable stacks like 43 → 59 → 63 work.
function stepFor(ex){ return (PREFS.inc && PREFS.inc[ex.id]) || ex.inc || 2.5; }
function num(x){ return Math.round(x*100)/100; }
function knownWeights(exId){
  const set = new Set();
  doneSessions().forEach(s=> workSets((s.entries||{})[exId]).forEach(x=>{ if(x.w>0) set.add(x.w); }));
  return [...set].sort((a,b)=> a-b);
}
function roundW(ex, w){
  const st = stepFor(ex);
  const near = knownWeights(ex.id).filter(k=> Math.abs(k-w) <= st/2)
                                  .sort((a,b)=> Math.abs(a-w)-Math.abs(b-w))[0];
  return num(Math.max(st, near != null ? near : Math.round(w/st)*st));
}
function upFrom(ex, w, steps){
  const st = stepFor(ex);
  if(steps === 1){
    const nxt = knownWeights(ex.id).find(k=> k > w && k <= w + 2*st);
    if(nxt != null) return nxt;
  }
  return num(w + st*steps);
}
// Three sessions with no gain in estimated 1RM = stalled. Layoffs and the
// rebuild right after a reset don't count. `again` = it already had a reset.
function stallState(ex){
  const ser = seriesFor(ex.id).slice(-6);
  if(ser.length < 3) return null;
  const n = ser.length, L = ser.slice(-3);
  const gapD = (a,b)=> Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000);
  for(let i=1;i<3;i++){
    if(gapD(L[i-1].date, L[i].date) >= 12) return null;
    if(L[i].topW <= L[i-1].topW*0.93) return null;
  }
  if(Math.max(L[1].e, L[2].e) > L[0].e*1.01) return null;
  let again = false;
  for(let i=1;i<=n-3;i++){
    if(ser[i].topW <= ser[i-1].topW*0.93 && gapD(ser[i-1].date, ser[i].date) < 12) again = true;
  }
  return {again};
}
// Strength doesn't fall off a cliff — little for a fortnight, then a gentle
// slide. Returns the share of your old top set worth opening with. Deliberately
// conservative: the first session back should feel easy.
function layoffFactorRaw(days){
  if(days == null || days < 12) return 1;
  if(days < 21) return 0.95;
  if(days < 35) return 0.90;
  if(days < 56) return 0.85;
  if(days < 84) return 0.80;
  return 0.72;
}
// Activity in the gap claws back part of the drop — but only for what it trained.
function layoffFactor(days, group){
  const base = layoffFactorRaw(days);
  if(base === 1) return 1;
  const r = (returnMode && returnMode.ret) ? (returnMode.ret[group] || 0) : 0;
  return base + (1 - base) * r;
}
function offLabel(days){
  if(days >= 56) return `${Math.round(days/30)} months off`;
  if(days >= 21) return `${Math.round(days/7)} weeks off`;
  return `${days} days off`;
}
function computeReturnMode(){
  const last = lastLiftSession();
  const d = last ? daysSince(last.date) : null;
  if(d == null || d < 14){ returnMode = null; return null; }
  returnMode = {days:d, label:offLabel(d), ret:{lower:0,push:0,pull:0,core:0,count:0,types:[]}};
  returnMode.ret = retentionOverGap(last.date);
  return returnMode;
}

// learned recommendation: projects a target from your recent trend, backs off
// after a layoff, and climbs in bigger steps over ground you've already held
// Double progression, steered by how the last set felt:
//  • hold the weight until every working set at it reaches the top of the range
//  • then add one step — two if it felt easy twice running (capped at ~7.5%)
//  • hit the top but it was a grind → repeat the weight
//  • three sessions without progress → reset ~10%; stalls again → swap variation
function suggestNext(ex){
  const le = lastEntry(ex.id);
  if(!le) return null;
  const sets = le.sets, eff = le.effort;
  const lo = effLo(ex), hi = effHi(ex), st = stepFor(ex);
  const gap = daysSince(le.date);
  const rusty = gap != null && gap >= 12;
  const grp = GROUP_OF[ex.cat] || 'push';

  if(ex.bw){                                    // bodyweight: progress reps, then added load
    const tops = recentTops(ex.id, true);
    const maxR = Math.max(...sets.map(s=>s.r));
    const addLoad = Math.max(...sets.map(s=>s.w));
    if(rusty){
      const target = Math.max(1, Math.round(maxR * layoffFactor(gap, grp)));
      return {bw:true, dir:'hold', tag:`${offLabel(gap)} — aim ~${target} reps, leave a couple in the tank`};
    }
    if(maxR >= hi && eff === 'grind') return {bw:true, dir:'hold', tag:`${maxR} reps but a grind — own it once more`};
    if(maxR >= hi) return {bw:true, dir:'up', tag: addLoad>0 ? `add load past +${fmt(addLoad)} kg` : `add load — past ${hi} reps`};
    const climbing = tops.length>=2 && tops[tops.length-1].r > tops[0].r;
    return {bw:true, dir:'hold', tag: climbing ? `trending up — beat ${maxR} reps` : `beat ${maxR} reps`};
  }

  const topW = Math.max(...sets.map(s=>s.w));

  // Coming back after time off: back the weight off rather than chasing old numbers.
  if(rusty){
    const w = roundW(ex, Math.max(st, topW * layoffFactor(gap, grp)));
    const kept = returnMode && (returnMode.ret[grp] || 0) >= 0.25;
    return {weight: w, dir:'hold',
            tag: kept
              ? `${offLabel(gap)} off the bar, but you've kept moving — start ${fmt(w)} kg`
              : `${offLabel(gap)} — ease in here, then climb back to ${fmt(topW)} kg`};
  }

  const repsMin = Math.min(...sets.filter(s=> s.w===topW).map(s=> s.r));
  const be = bestEver(ex.id);
  const rebuilding = be > topW + st;            // you've handled more than this before

  // A stall only counts if the last session fell short of the top of the range —
  // hitting every rep and just not adding weight isn't a stall.
  const stall = (rebuilding || repsMin >= hi) ? null : stallState(ex);
  if(stall && stall.again) return {weight: topW, dir:'swap', tag:'stalled again after a reset — swap to a variation'};
  if(stall){
    const w = roundW(ex, topW*0.9);
    if(w < topW) return {weight: w, dir:'reset', tag:`no progress in 3 sessions — reset to ${fmt(w)} kg and rebuild`};
  }

  if(repsMin < lo){
    if(eff === 'grind' && repsMin <= lo-2){
      const w = roundW(ex, topW - st);
      if(w < topW) return {weight: w, dir:'repeat', tag:`too heavy — drop to ${fmt(w)} kg, build to ${lo}–${hi}`};
    }
    return {weight: topW, dir:'repeat', tag:`build to ${lo}–${hi} at ${fmt(topW)} kg`};
  }

  if(repsMin >= hi){
    if(eff === 'grind') return {weight: topW, dir:'hold', tag:`hit ${hi} but it was a grind — own it once more`};
    const trail = effortTrail(ex.id, 2);
    const easyTwice = trail[0]==='easy' && trail[1]==='easy';
    let steps = (easyTwice || rebuilding) ? 2 : 1;
    if(steps === 2 && 2*st > topW*0.075) steps = 1;          // sanity cap on big jumps
    let w = upFrom(ex, topW, steps);
    if(rebuilding) w = Math.min(w, be);
    const tag = rebuilding ? `climbing back toward ${fmt(be)} kg`
              : (easyTwice && steps===2) ? 'easy twice running — bigger jump'
              : `every set hit ${hi} — add weight`;
    return {weight: w, dir:'up', tag};
  }

  return {weight: topW, dir:'hold',
          tag: eff === 'easy' ? `felt easy — push every set to ${hi}` : `chase ${hi} reps on every set`};
}

function fillWeight(exId, w){
  document.querySelectorAll(`#exlist input[data-ex="${exId}"][data-f="w"]`).forEach(i=> i.value = w);
}

function setRowHTML(exId, i, phW, val){
  const wv = val && val.w!=null ? ` value="${val.w}"` : '';
  const rv = val && val.r!=null ? ` value="${val.r}"` : '';
  const wu = !!(val && val.wu);
  return `<div class="set${wu?' wu':''}" data-ex="${exId}">
    <button type="button" class="sn" title="Tap to mark as a warm-up" onclick="toggleWarm(this)">${wu?'W':i+1}</button>
    <div class="inp"><input inputmode="decimal" data-ex="${exId}" data-f="w" placeholder="${phW}"${wv}><span class="unit">kg</span></div>
    <div class="inp"><input inputmode="numeric" data-ex="${exId}" data-f="r" placeholder=""${rv}></div>
  </div>`;
}
function toggleWarm(btn){
  const row = btn.closest('.set');
  row.classList.toggle('wu');
  row.parentNode.querySelectorAll('.set').forEach((r,i)=>{
    r.querySelector('.sn').textContent = r.classList.contains('wu') ? 'W' : i+1;
  });
}
const EFF_OPTS = [['easy','Easy','3+ left'],['solid','Solid','1–2 left'],['grind','Grind','0 left']];
function effortHTML(exId, sel){
  return `<div class="effort" data-eff="${exId}"><span class="effort-l">Last set felt</span>${
    EFF_OPTS.map(([v,l,sub])=> `<button type="button" class="effchip${sel===v?' on':''}" data-v="${v}" onclick="setEffort('${exId}','${v}')"><b>${l}</b><small>${sub}</small></button>`).join('')
  }</div>`;
}
async function setEffort(id, v){
  const cur = (id in pendingEffort) ? pendingEffort[id] : ((activeDraft && activeDraft.effort && activeDraft.effort[id]) || '');
  pendingEffort[id] = cur === v ? '' : v;
  document.querySelectorAll(`.effort[data-eff="${id}"] .effchip`).forEach(b=> b.classList.toggle('on', b.dataset.v === pendingEffort[id]));
  if(activeDraft && activeDraft.entries[id]){
    activeDraft.effort = activeDraft.effort || {};
    if(pendingEffort[id]) activeDraft.effort[id] = pendingEffort[id]; else delete activeDraft.effort[id];
    await persist();
  }
}

function renderTrain(){
  computeReturnMode();
  const list = document.getElementById('exlist');
  // keep anything typed but not yet saved across re-renders (add / remove / swap / date change)
  const keep = {};
  list.querySelectorAll('.setrows').forEach(c=>{
    const rows = [...c.querySelectorAll('.set')].map(r=>({
      w: r.querySelector('[data-f="w"]').value, r: r.querySelector('[data-f="r"]').value, wu: r.classList.contains('wu')}));
    if(rows.some(x=> x.w!=='' || x.r!=='' || x.wu)) keep[c.dataset.rows] = rows;
  });
  list.innerHTML = '';
  if(currentDay==='X'){ list.innerHTML = activityFormHTML(); onActType(); return; }
  const exs = workList;

  exs.forEach(ex=>{
    const last = lastTopSet(ex.id);
    const sug = suggestNext(ex);
    let phW = '';
    if(sug && !sug.bw) phW = fmt(sug.weight);
    else if(last && !(ex.bw && last.w===0)) phW = fmt(last.w);
    const saved = activeDraft && activeDraft.entries[ex.id] && activeDraft.entries[ex.id].length ? activeDraft.entries[ex.id] : null;
    const src = keep[ex.id] || saved;
    const card = document.createElement('div');
    card.className = 'ex' + (saved ? ' saved' : '');
    card.setAttribute('data-card', ex.id);
    let rows = '';
    const nSets = Math.max(effSets(ex), src ? src.length : 0);
    for(let i=0;i<nSets;i++) rows += setRowHTML(ex.id, i, phW, src ? src[i] : null);

    const ARROW = {up:'↑', hold:'→', repeat:'↺', reset:'↓', swap:'⇄'};
    let pill;
    if(sug && sug.bw){
      pill = `<div class="sug ${sug.dir}">${ARROW[sug.dir]} ${sug.tag}</div>`;
    } else if(sug && sug.dir==='swap'){
      pill = `<button class="sug swap" onclick="swapLift('${ex.id}')">⇄ ${sug.tag}</button>`;
    } else if(sug){
      pill = `<button class="sug ${sug.dir}" onclick="fillWeight('${ex.id}',${sug.weight})">${ARROW[sug.dir]} ${fmt(sug.weight)} kg · ${sug.tag}</button>`;
    } else if(last){
      pill = (ex.bw && last.w===0)
        ? `<div class="sug repeat">↺ last ${last.r} reps — beat it</div>`
        : `<button class="sug repeat" onclick="fillWeight('${ex.id}',${last.w})">↺ ${fmt(last.w)} kg last — beat it</button>`;
    } else {
      pill = `<div class="sug base">${ex.bw?'Bodyweight — log reps (add kg if loaded)':'New lift — set your baseline'}</div>`;
    }
    const lastVal = last ? `${(ex.bw && last.w===0)?'BW':fmt(last.w)}<small style="font-size:12px;color:var(--muted-dim)">×${last.r}</small>` : '';
    const restSec = gcfg(ex).rest;
    const effSel = (ex.id in pendingEffort) ? pendingEffort[ex.id]
                 : ((activeDraft && activeDraft.effort && activeDraft.effort[ex.id]) || '');

    card.innerHTML = `
      <div class="ex-head">
        <div>
          <h2 class="ex-name" onclick="openInfo('${ex.id}')">${ex.name} <span class="info-i">ⓘ</span></h2>
          <div class="ex-target">${repsLabel(ex)}</div>
          ${pill}
        </div>
        <div class="ex-right">
          <div class="last">
            <div class="k">Last</div>
            ${ last ? `<div class="v">${lastVal}</div>` : `<div class="v none">—</div>` }
          </div>
          <div class="ex-btns">
            <button class="swapbtn" title="Swap for an alternative" onclick="swapLift('${ex.id}')">⇄</button>
            <button class="rm" title="Remove" onclick="removeLift('${ex.id}')">×</button>
          </div>
        </div>
      </div>
      <div class="colhdr"><span>Set</span><span>Weight</span><span>Reps</span></div>
      <div class="setrows" data-rows="${ex.id}">${rows}</div>
      ${effortHTML(ex.id, effSel)}
      <div class="ex-foot">
        <button class="addset" onclick="addSetRow('${ex.id}')">+ add set</button>
        <button class="restbtn" onclick="startRest(${restSec})">⏱ rest ${fmtRest(restSec)}</button>
        <button class="savelift${saved?' done':''}" id="sv-${ex.id}" onclick="saveLift('${ex.id}')">${saved?'✓ Saved':'Save lift'}</button>
      </div>`;
    list.appendChild(card);
  });

  if(!exs.length && currentDay==='C'){
    list.insertAdjacentHTML('beforeend','<div class="empty" style="padding:4px 2px 12px">Add the lifts you did, in order.</div>');
  }
  list.appendChild(buildAddLift());
}

function buildAddLift(){
  const groups = CAT_ORDER.map(cat=>{
    const opts = (CAND[cat]||[])
      .filter(id=> !workList.some(c=>c.id===id))
      .map(id=> `<option value="${id}">${EXDEF[id].name}</option>`).join('');
    return opts ? `<optgroup label="${CAT_LABEL[cat]}">${opts}</optgroup>` : '';
  }).join('');
  const box = document.createElement('div');
  box.className = 'addlift';
  box.innerHTML = `
    <div class="addlift-row">
      <select id="liftpick" onchange="onLiftPick()">
        <option value="">Add a lift…</option>
        ${groups}
        <option value="__c">Other — type a name…</option>
      </select>
      <button class="addbtn" onclick="addPickedLift()">Add</button>
    </div>
    <input id="customname" class="hidden" placeholder="e.g. Sled push, Pallof press">`;
  return box;
}

function onLiftPick(){
  const v = document.getElementById('liftpick').value;
  document.getElementById('customname').classList.toggle('hidden', v !== '__c');
  if(v==='__c') document.getElementById('customname').focus();
}

function addPickedLift(){
  const sel = document.getElementById('liftpick');
  const v = sel.value;
  if(!v){ return; }
  let lift;
  if(v==='__c'){
    const name = (document.getElementById('customname').value || '').trim();
    if(!name){ toast('Type a lift name'); return; }
    const id = 'c_' + name.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
    if(!id || id==='c_'){ toast('Use letters or numbers'); return; }
    if(workList.some(c=>c.id===id)){ toast('Already added'); return; }
    NAMES_REG[id] = name;
    lift = {id, name, sets:3};
  } else {
    if(workList.some(c=>c.id===v)){ toast('Already added'); return; }
    lift = EXDEF[v];
  }
  workList.push(lift);
  renderTrain();
}

function removeLift(id){
  workList = workList.filter(e=> e.id !== id);
  renderTrain();
}

// offer alternatives that train the same pattern, then swap one in
function swapLift(oldId){
  const card = document.querySelector(`#exlist .ex[data-card="${oldId}"]`);
  if(!card) return;
  const existing = card.querySelector('.swaptray');
  if(existing){ existing.remove(); return; }      // tapping again closes it
  const cat = PATTERN[oldId];
  if(!cat){ toast('No alternatives for a custom lift — remove and add another'); return; }
  const inWork = new Set(workList.map(e=>e.id));
  const role = EXDEF[oldId] ? EXDEF[oldId].role : 'accessory';
  let cands = (CAND[cat]||[]).filter(id=> id!==oldId && !inWork.has(id));
  cands.sort((a,b)=> (EXDEF[a].role===role?0:1) - (EXDEF[b].role===role?0:1));   // same role first
  cands = cands.slice(0,6);
  if(!cands.length){ toast('No other options in that group'); return; }
  const chips = cands.map(id=> `<button class="swapchip" onclick="doSwap('${oldId}','${id}')">${EXDEF[id].name}</button>`).join('');
  const lbl = mainIds().has(oldId) ? 'Main lift for this block — swapping is just for today:' : "Don't feel like it? Swap for:";
  const tray = `<div class="swaptray"><span class="swaptray-l">${lbl}</span>${chips}<button class="swapchip cancel" onclick="swapLift('${oldId}')">✕ keep</button></div>`;
  card.querySelector('.ex-head').insertAdjacentHTML('afterend', tray);
}
function doSwap(oldId, newId){
  const i = workList.findIndex(e=> e.id===oldId);
  if(i<0 || !EXDEF[newId]) return;
  workList[i] = EXDEF[newId];
  delete pendingEffort[oldId];
  if(activeDraft && activeDraft.entries[oldId]){ delete activeDraft.entries[oldId]; persist(); }
  renderTrain();
  toast(`Swapped to ${EXDEF[newId].name}`);
}

// stylised front/back muscle map; `active` = Set of highlighted region keys
function bodySVG(active){
  const on='var(--amber)', off='#26344C', st='#3C4E6E';
  const c = k => active.has(k) ? on : off;
  const sh = (x,y,w,h,r,k)=> `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${c(k)}" stroke="${st}" stroke-width="1"/>`;
  const el = (cx,cy,rx,ry,k)=> `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${c(k)}" stroke="${st}" stroke-width="1"/>`;
  return `<svg viewBox="0 0 260 210" width="100%" style="max-width:300px;display:block;margin:6px auto 0">
    <!-- FRONT -->
    <circle cx="65" cy="20" r="11" fill="#172234" stroke="${st}"/>
    ${el(45,46,9,7,'delts')}${el(85,46,9,7,'delts')}
    ${sh(50,40,30,22,6,'chest')}
    ${sh(36,50,11,26,5,'biceps')}${sh(83,50,11,26,5,'biceps')}
    ${sh(54,64,22,26,5,'abs')}
    ${sh(33,78,10,24,5,'forearms')}${sh(87,78,10,24,5,'forearms')}
    ${sh(52,94,12,42,5,'quads')}${sh(66,94,12,42,5,'quads')}

function lastSession(){

}
// most recent lifting session (ignores activity logs) — drives the generator
function lastLiftSession(){
  return doneSessions().filter(s=> s.kind!=='activity' && s.entries && Object.keys(s.entries).length)
    .sort((a,b)=> b.date.localeCompare(a.date) || b.id-a.id)[0] || null;

// today's date in the phone's LOCAL timezone as YYYY-MM-DD
// (never toISOString — that's UTC and reads as "yesterday" in NZ)
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// days between the planned (date field) session and the last logged one
function gapDays(lastDate){
  const planned = document.getElementById('sessdate').value;
  if(!planned || !lastDate) return 7;
  const ms = new Date(planned+'T00:00:00') - new Date(lastDate+'T00:00:00');
  const d = Math.round(ms/86400000);
  return d > 0 ? d : 1;
}

// how much each activity taxes the legs / posterior chain (0 none → 2 heavy)
const ACT_LEG = {
  'Run':2,'Hike':2,'Football':2,'Squash':2,'Cycle':1,'Walk':1,'Tennis':1,
  'Rowing':1,'Climbing':1,'Other':1,'Swim':0,'Yoga / mobility':0
};

// What a non-lifting activity preserves while you're away from the bar, by
// muscle group. Ceilings are deliberately modest: running maintains conditioning
// and tissue tolerance, NOT maximal strength. Nothing here holds your bench.
const ACT_MAINT = {
  'Run':            {lower:.45, push:.00, pull:.00, core:.15},
  'Football':       {lower:.45, push:.00, pull:.00, core:.15},
  'Hike':           {lower:.40, push:.00, pull:.00, core:.10},
  'Cycle':          {lower:.35, push:.00, pull:.00, core:.05},
  'Squash':         {lower:.35, push:.05, pull:.05, core:.15},
  'Tennis':         {lower:.30, push:.05, pull:.05, core:.15},
  'Rowing':         {lower:.30, push:.10, pull:.35, core:.25},
  'Climbing':       {lower:.25, push:.10, pull:.50, core:.35},
  'Swim':           {lower:.15, push:.20, pull:.30, core:.20},
  'Walk':           {lower:.20, push:.00, pull:.00, core:.00},
  'Yoga / mobility':{lower:.15, push:.05, pull:.05, core:.30},
  'Other':          {lower:.20, push:.05, pull:.05, core:.10},
};
const GROUP_OF = {knee:'lower',hinge:'lower',calf:'lower',
                  hpush:'push',vpush:'push',triceps:'push',
                  hpull:'pull',vpull:'pull',biceps:'pull', core:'core'};

// Frequency-weighted retention across the lifting gap. One run in six weeks is
// noise; twice a week earns the full ceiling for that activity.
function retentionOverGap(sinceDate){
  const until = (document.getElementById('sessdate') || {}).value || todayStr();
  const acts = sessions.filter(s=> s.kind==='activity' && s.date > (sinceDate||'') && s.date <= until);
  const days = Math.max(7, Math.round((new Date(until+'T00:00:00') - new Date((sinceDate||until)+'T00:00:00'))/86400000));
  const weeks = days/7;
  const out = {lower:0, push:0, pull:0, core:0};
  const byType = {};
  acts.forEach(s=>{ (byType[s.activity] = byType[s.activity] || []).push(s); });
  Object.keys(byType).forEach(type=>{
    const m = ACT_MAINT[type] || ACT_MAINT['Other'];
    const list = byType[type];
    const perWeek = list.length / weeks;
    let scale = Math.min(1, perWeek/2);                        // 2×/week = full credit
    const avgMin = list.reduce((a,s)=> a+(s.durationMin||0),0)/list.length;
    if(avgMin >= 60) scale = Math.min(1, scale*1.15);          // longer efforts count more
    if(avgMin && avgMin < 25) scale *= 0.7;
    Object.keys(out).forEach(g=>{ out[g] = Math.max(out[g], (m[g]||0)*scale); });
  });
  out.count = acts.length;
  out.types = Object.keys(byType);
  return out;
}

// look at activities logged since the last lift and up to the planned date, and
// decide whether the legs are likely still fatigued going into this session
function activityFatigue(lastLiftDate){
  const planned = document.getElementById('sessdate').value;
  if(!planned) return null;
  const pms = new Date(planned+'T00:00:00').getTime();
  const intMult = i => i==='Hard' ? 1.5 : i==='Easy' ? 0.6 : 1;   // Moderate / blank = 1
  let best = null;
  sessions.filter(s=> s.kind==='activity').forEach(s=>{
    const ams = new Date(s.date+'T00:00:00').getTime();
    const gap = Math.round((pms - ams)/86400000);
    if(gap < 0 || gap > 3) return;                                 // only the few days before
    if(lastLiftDate && s.date < lastLiftDate) return;              // only since the last lift
    const base = ACT_LEG[s.activity] != null ? ACT_LEG[s.activity] : 1;
    let score = base * intMult(s.intensity);
    if((s.durationMin||0) >= 90 || (s.distanceKm||0) >= 12) score += 0.5;  // long efforts add up
    if(gap >= 2) score *= 0.5;                                     // older = mostly recovered
    if(!best || score > best.score) best = {score, gap, s};
  });
  if(!best) return null;
  return { ease: best.score >= 2 && best.gap <= 1, score: best.score, gap: best.gap,
           activity: best.s.activity, intensity: best.s.intensity, date: best.s.date };
}

// THE ENGINE — builds a full session. type 'auto' rotates off the last workout;
// other types ('quad','hinge','push','pull','arms','upper','lower') let you
// override the emphasis. All stay balanced, vary the lifts, and ease axial work
// on back-to-back days.
const PLAN_TYPES = [
  ['auto','Auto'],['quad','Quad'],['hinge','Hinge'],['push','Push'],
  ['pull','Pull'],['arms','Arms'],['upper','Upper'],['lower','Lower']
];

function buildPlan(type){
  type = type || 'auto';
  const last = lastLiftSession();
  const n = doneSessions().filter(s=> s.kind!=='activity').length;
  const did = new Set(last ? Object.keys(last.entries) : []);
  const didCat = c => [...did].some(id=> PATTERN[id]===c);
  const backToBack = last ? gapDays(last.date) <= 1 : false;
  const af = activityFatigue(last ? last.date : null);
  const easeLower = backToBack || (af && af.ease);
  const rm = computeReturnMode();
  // After time off, rotating onto *fresh* lifts is the wrong move — you want the
  // movements you have numbers for, so the app can steer you back onto them.
  const avoid = rm ? new Set() : new Set(did);
  // Acute fatigue still applies: a hard run two days ago pulls the heavy axial
  // work even when you're returning from a layoff.
  const avoidLower = easeLower ? new Set([...(rm ? [] : did), ...HIGH_FATIGUE]) : avoid;

  function pick(cats, roles, skip, salt){
    let cand = [];
    cats.forEach(c=> cand = cand.concat(CAND[c]||[]));
    cand = cand.filter(id=> roles.includes(EXDEF[id].role));
    if(!cand.length) return null;
    if(roles.includes('compound')){
      const mains = mainIds();
      const pref = cand.find(id=> mains.has(id) && !skip.has(id) && EXDEF[id].role==='compound');
      if(pref) return pref;
    }
    const start = (n + salt) % cand.length;
    for(let i=0;i<cand.length;i++){ const id = cand[(start+i)%cand.length]; if(!skip.has(id)) return id; }
    return cand[start];
  }

  // Read what your LAST session actually led with (first lift of each pattern) and
  // lead the new one with the opposite — genuinely alternates, regardless of the
  // fact that full-body days contain every pattern. Parity is just the fallback.
  function firstOf(cats){
    const order = (last && last.plan && last.plan.length) ? last.plan
                : (last ? Object.keys(last.entries) : []);
    for(const id of order){ if(cats.includes(PATTERN[id])) return PATTERN[id]; }
    return null;
  }
  const lastLower = firstOf(['hinge','knee']);
  const lowerLead = lastLower==='hinge' ? 'knee' : lastLower==='knee' ? 'hinge' : (n%2?'hinge':'knee');
  const lastPush  = firstOf(['hpush','vpush']);
  const pushLead  = lastPush==='hpush' ? 'vpush' : lastPush==='vpush' ? 'hpush' : (n%2?'vpush':'hpush');
  const otherPush = pushLead==='hpush' ? 'vpush' : 'hpush';
  const lastPull  = firstOf(['hpull','vpull']);
  const pullLead  = lastPull==='hpull' ? 'vpull' : lastPull==='vpull' ? 'hpull' : (n%2?'hpull':'vpull');

  const ids = [];
  const add = id => { if(id && !ids.includes(id)) ids.push(id); };
  const used = () => new Set([...avoid, ...ids]);
  const when = g => g<=0 ? 'today' : g===1 ? 'yesterday' : `${g} days ago`;
  let recoveryNote = '';
  if(rm){
    const loPct = Math.round((1-layoffFactor(rm.days,'lower'))*100);
    const upPct = Math.round((1-layoffFactor(rm.days,'push'))*100);
    const acts = rm.ret.types.length ? rm.ret.types.join(' and ').toLowerCase() : '';
    recoveryNote = ` You've had ${rm.label} away from the bar` +
      (rm.ret.count ? `, though you logged ${rm.ret.count} ${acts} session${rm.ret.count>1?'s':''} in that time.` : '.') +
      (loPct !== upPct
        ? ` Weights are backed off ~${upPct}% up top and ~${loPct}% on the legs — the ${acts||'cardio'} held your conditioning, not your pressing.`
        : ` Weights are backed off about ${loPct}%.`) +
      ` Two reps in reserve on everything.` +
      (rm.ret.lower >= .3 ? ` Fair warning: running keeps the engine going but doesn't prepare the legs for loaded squats — expect to be sore.` : '');
  } else if(backToBack){
    recoveryNote = ' Heavy axial work is eased since you trained yesterday.';
  } else if(af && af.ease){
    recoveryNote = ` You logged a ${af.intensity?af.intensity.toLowerCase()+' ':''}${af.activity.toLowerCase()} ${when(af.gap)}, so heavy leg work is eased today.`;
  } else if(af && af.gap<=1 && af.score>=1){
    recoveryNote = ` (Factored in your ${af.activity.toLowerCase()} ${when(af.gap)} — light enough to train as normal.)`;
  }
  const b2bNote = recoveryNote;
  let title, why, slot = null;

  if(type==='upper'){
    add(pick([pushLead],['compound'],avoid,2));
    add(pick([otherPush],['compound','accessory'],used(),4));
    add(pick(['vpull'],['compound'],avoid,3));
    add(pick(['hpull'],['compound'],used(),5));
    add(pick(['vpush'],['iso'],used(),6));
    add(pick(['biceps'],['iso'],avoid,7));
    add(pick(['triceps'],['iso','compound'],avoid,8));
    title='Upper body'; why='Upper-body session — pressing, pulling, shoulders and arms, no legs today.'+b2bNote;
  } else if(type==='lower'){
    add(pick(['knee'],['compound'],avoidLower,0));
    add(pick(['hinge'],['compound'],avoidLower,1));
    add(pick(['knee'],['accessory','iso'],used(),2));
    add(pick(['hinge'],['iso','accessory'],used(),3));
    add(pick(['calf'],['iso'],avoid,4));
    add(pick(['core'],['iso'],avoid,5));
    title='Lower body'; why='Legs and posterior chain — quads, hamstrings, glutes and calves.'+b2bNote;
  } else if(type==='arms'){
    add(pick(['biceps'],['iso'],avoid,1));
    add(pick(['triceps'],['iso','compound'],avoid,2));
    add(pick(['biceps'],['iso'],used(),3));
    add(pick(['triceps'],['iso'],used(),4));
    add(pick([pushLead,otherPush],['compound'],avoid,5));
    add(pick(['vpull','hpull'],['compound'],avoid,6));
    add(pick([lowerLead],['compound'],avoidLower,0));
    title='Full body · arms lead'; why='Extra biceps and triceps volume, rounded out with a press, a pull and one big lower lift.'+b2bNote;
  } else if(type==='push'){
    add(pick(['hpush'],['compound'],avoid,1));
    add(pick(['vpush'],['compound'],used(),2));
    add(pick(['hpush','vpush'],['iso','accessory'],used(),3));
    add(pick(['vpull','hpull'],['compound'],avoid,4));
    add(pick([lowerLead],['compound'],avoidLower,0));
    add(pick(['triceps'],['iso'],avoid,5));
    add(pick(['core'],['iso'],avoid,6));
    title='Full body · push lead'; why='Pressing emphasis — chest and shoulders get the volume, balanced by a pull and a leg lift.'+b2bNote;
  } else if(type==='pull'){
    add(pick(['vpull'],['compound'],avoid,1));
    add(pick(['hpull'],['compound'],used(),2));
    add(pick(['hpull','vpull'],['iso'],used(),3));
    add(pick(['hpush','vpush'],['compound'],avoid,4));
    add(pick([lowerLead],['compound'],avoidLower,0));
    add(pick(['biceps'],['iso'],avoid,5));
    add(pick(['core'],['iso'],avoid,6));
    title='Full body · pull lead'; why='Pulling emphasis — back, lats and biceps get the volume, balanced by a press and a leg lift.'+b2bNote;
  } else if(type==='auto'){
    ensureBlock();
    slot = (last && last.slot) ? (last.slot==='A' ? 'B' : 'A') : (lastLower==='knee' ? 'B' : 'A');
    const mains = SLOT_CATS[slot].map(c=> BLOCK[slot][c]);
    const allMain = mainIds();
    let subbed = '';
    mains.forEach(id=>{
      if(easeLower && HIGH_FATIGUE.has(id)){
        const alt = pick([PATTERN[id]], ['compound'], new Set([...HIGH_FATIGUE, ...allMain, ...ids]), 0);
        if(alt && !HIGH_FATIGUE.has(alt)){ add(alt); subbed = ` ${getName(id)} is swapped for ${getName(alt)} today to spare your legs.`; return; }
      }
      add(id);
    });
    const skipAcc = () => new Set([...avoid, ...ids, ...allMain]);
    const acc = slot==='A'
      ? [[['hinge'],['accessory','iso']], [['vpush'],['accessory','iso','compound']], [['hpull','vpull'],['iso']],
         [['biceps'],['iso']], [['triceps'],['iso','compound']], [['calf'],['iso']]]
      : [[['knee'],['accessory','iso']], [['hpush'],['accessory','iso','compound']], [['hpull','vpull'],['iso']],
         [['biceps'],['iso']], [['triceps'],['iso','compound']], [['core'],['iso']]];
    acc.forEach(([cats, roles], i)=> add(pick(cats, roles, skipAcc(), i+1)));
    title = `Session ${slot} · ${slot==='A'?'squat':'hinge'} lead`;
    why = `Main lifts — ${mains.map(getName).join(', ')} — stay fixed for the block so they keep progressing; accessories rotate.${subbed}${b2bNote}`;
  } else {
    const lead = type==='quad' ? 'knee' : type==='hinge' ? 'hinge' : lowerLead;
    const otherLower = lead==='knee' ? 'hinge' : 'knee';
    add(pick([lead],['compound'],avoidLower,0));
    add(pick([otherLower],['accessory','iso'],avoid,1));
    add(pick([pushLead],['compound'],avoid,2));
    add(pick([pullLead],['compound'],avoid,3));
    add(pick([otherPush],['iso','accessory','compound'],used(),4));
    add(pick(['hpull','vpull'],['iso'],used(),5));
    add(pick(['biceps'],['iso'],avoid,6));
    add(pick(['triceps'],['iso','compound'],avoid,7));
    add(pick([ n%2 ? 'calf' : 'core' ],['iso'],avoid,8));
    title = `Full body · ${lead==='knee'?'quad':'hinge'} lead`;
    why = (type==='auto')
      ? (last
          ? `Alternating off your recent training, this one leads with ${lead==='knee'?'a squat':'a hinge'} and rotates fresh variations across pressing, pulling and arms so nothing repeats.${b2bNote}`
          : 'No history yet — a balanced full-body session across every major pattern. Log it and the next one programs off what you trained.')
      : `${lead==='knee'?'Quad':'Hinge'}-led full body — balanced pressing, pulling and arms.${b2bNote}`;
  }
  // Easing back in: shorter session, familiar movements, and say so on the tin.
  if(rm){
    title += ' · easing back';
    if(type==='auto' && last){
      why = `First session back after ${rm.label}. This one sticks to movements you already have numbers for, so the weights can steer you back onto them.${b2bNote}`;
    }
  }
  let out = ids.filter(Boolean);
  if(rm) out = out.slice(0, rm.days >= 35 ? 5 : 6);
  return { type, title, why, ids: out, slot };
}

function planFromLast(){ return buildPlan(currentPlanType); }

// ── Training block: main lifts stay fixed for 6 weeks so they can progress ──
// Session A leads with a squat, B with a hinge; accessories keep rotating.
const SLOT_CATS = {A:['knee','hpush','vpull'], B:['hinge','vpush','hpull']};
function mainIds(){
  const s = new Set();
  if(BLOCK) ['A','B'].forEach(sl=> Object.values(BLOCK[sl]||{}).forEach(id=> s.add(id)));
  return s;
}
function newBlock(rotate){
  const prev = BLOCK;
  const b = {start: todayStr(), weeks: 6, A:{}, B:{}, updated: Date.now()};
  ['A','B'].forEach(sl=> SLOT_CATS[sl].forEach(cat=>{
    const comps = (CAND[cat]||[]).filter(id=> EXDEF[id].role==='compound');
    let id;
    if(rotate && prev && prev[sl] && prev[sl][cat]){
      const i = comps.indexOf(prev[sl][cat]);
      id = comps[(i+1) % comps.length];
    } else {
      // start with what you already have numbers for; ties keep library order
      id = comps.slice().sort((a,c)=> sessionsWith(c).length - sessionsWith(a).length)[0];
    }
    b[sl][cat] = id;
  }));
  return b;
}
function ensureBlock(){
  if(BLOCK && BLOCK.A && BLOCK.B) return;
  BLOCK = newBlock(false);
  BLOCK.updated = 0;           // auto-created: a synced block from another device wins
  persist();
}
function blockWeek(){
  if(!BLOCK) return 1;
  const planned = (document.getElementById('sessdate')||{}).value || todayStr();
  const d = Math.round((new Date(planned+'T00:00:00') - new Date(BLOCK.start+'T00:00:00'))/86400000);
  return Math.floor(Math.max(0,d)/7) + 1;
}
async function startNewBlock(){
  const done = blockWeek() > BLOCK.weeks;
  if(!done && !confirm('Start a new block now? Each main lift rotates to a fresh variation for the next 6 weeks.')) return;
  BLOCK = newBlock(true);
  await persist(); scheduleSync();
  setPlanType('auto');
  toast('New block started');
}

function renderPlanBanner(plan){
  const el = document.getElementById('planbanner');
  if(currentDay !== 'N'){ el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  const planned = document.getElementById('sessdate').value;
  const d = new Date(planned+'T00:00:00');
  const when = isNaN(d) ? 'Next session' : d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'});
  const cs = returnMode ? Math.max(2, SCHEME.compound.sets-1) : SCHEME.compound.sets;
  const isets = returnMode ? Math.max(2, SCHEME.iso.sets-1) : SCHEME.iso.sets;
  let blockHTML = '';
  if(plan.type==='auto' && BLOCK){
    const wk = blockWeek(), done = wk > BLOCK.weeks;
    const mains = ['A','B'].map(sl=> `<b>${sl}:</b> ${SLOT_CATS[sl].map(c=> getName(BLOCK[sl][c])).join(', ')}`).join('<br>');
    blockHTML = `<div class="pb-why" style="margin-top:8px">${done
        ? `<b>Block complete</b> — ${BLOCK.weeks} weeks done. Time to rotate the main lifts.`
        : `<b>Block week ${wk} of ${BLOCK.weeks}.</b>`}<br>${mains}</div>
      <button class="pb-btn${done?' hot':''}" onclick="startNewBlock()">${done?'Start new block':'New block'}</button>`;
  }
  el.innerHTML = `<div class="pb-title">${when} · ${plan.title}</div>
    <div class="pb-why">${plan.why}</div>
    <div class="pb-why" style="margin-top:6px"><b>Targets:</b> ${cs} sets on compounds, ${isets} on isolation — each lift's rep range is on its card. Rate the last set of each lift so the next suggestion knows how hard it was; tap a set number to mark a warm-up.</div>
    ${blockHTML}`;
}

function buildAutoPlan(){
  // default to today — so "train now" is the assumption, and recent activities /
  // back-to-back recovery are measured against today (push the date out to plan ahead)
  document.getElementById('sessdate').value = todayStr();
  const plan = planFromLast();
  currentPlanTitle = plan.title; currentPlanSlot = plan.slot || null;
  workList = plan.ids.map(id=> EXDEF[id]).filter(Boolean);
  renderPlanBanner(plan);
  renderTypePick();
}

function renderTypePick(){
  const el = document.getElementById('typepick');
  if(currentDay!=='N'){ el.classList.remove('show'); return; }
  el.classList.add('show');
  el.innerHTML = PLAN_TYPES.map(([t,label])=>
    `<button class="typechip${currentPlanType===t?' on':''}" onclick="setPlanType('${t}')">${label}</button>`).join('');
}

function setPlanType(t){
  currentPlanType = t;
  const plan = planFromLast();
  currentPlanTitle = plan.title; currentPlanSlot = plan.slot || null;
  workList = plan.ids.map(id=> EXDEF[id]).filter(Boolean);
  renderPlanBanner(plan);
  renderTypePick();
  renderTrain();
}

function onDateChange(){
  if(currentDay==='N'){            // regenerate — a 1-day gap trains differently to a 7-day gap
    const plan = planFromLast();
    currentPlanTitle = plan.title; currentPlanSlot = plan.slot || null;
    workList = plan.ids.map(id=> EXDEF[id]).filter(Boolean);
    renderPlanBanner(plan);
    renderTrain();
  }
}

function setDay(d){
  // if there's an in-progress draft from a different mode, finalise it so work isn't lost
  if(activeDraft && activeDraft.mode!==d){
    if(Object.keys(activeDraft.entries).length){ delete activeDraft.draft; persist(); scheduleSync(); }
    else { sessions = sessions.filter(s=> s!==activeDraft); }
    activeDraft = null;
  }
  if(!activeDraft) pendingEffort = {};
  document.getElementById('exlist').innerHTML = '';     // fresh screen — don't carry typed values over
  currentDay = d;
  ['N','C','X'].forEach(x=> document.getElementById('day-'+x).classList.toggle('on', d===x));
  if(d==='N'){ currentPlanType = 'auto'; buildAutoPlan(); }
  else { workList = (d==='C') ? [] : workList; document.getElementById('planbanner').classList.add('hidden'); document.getElementById('typepick').classList.remove('show'); document.getElementById('sessdate').value = todayStr(); }
  renderTrain();
}

let restInt, restEnd;
function startRest(sec){
  clearInterval(restInt);
  restEnd = Date.now() + sec*1000;
  const el = document.getElementById('resttimer');
  el.classList.add('show'); el.classList.remove('done');
  tickRest();
  restInt = setInterval(tickRest, 250);
}
function tickRest(){
  const el = document.getElementById('resttimer');
  const left = Math.round((restEnd - Date.now())/1000);
  if(left <= 0){
    clearInterval(restInt);
    el.classList.add('done');
    el.textContent = 'Rest done — go';
    setTimeout(()=>{ el.classList.remove('show','done'); }, 4000);
    return;
  }
  el.textContent = `Rest ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;
}
function stopRest(){
  clearInterval(restInt);
  document.getElementById('resttimer').classList.remove('show','done');
}
