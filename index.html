    --amber-line:rgba(39,225,193,.45);
    --steel:#6F8BD6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--chalk);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    line-height:1.4;
    padding-bottom:96px;
    overscroll-behavior-y:contain;

<body>
<div class="wrap">
  <!-- (All your original HTML structure remains exactly the same) -->
  <header>
    <div class="brand">
      <h1>Iron<span class="x">.</span>Log</h1>
      <span class="tag">Full-body · Weekends</span>
    </div>
    <div class="sub">Beat last week's top set. Add 2.5 kg or a rep when it moves clean.</div>
  </header>

  <div class="tabs">
    <button id="tab-train" class="on" onclick="switchTab('train')">Train</button>
    <button id="tab-prog" onclick="switchTab('prog')">Progress</button>
  </div>

  <!-- TRAIN -->
  <section id="view-train">
    <!-- (All original train UI) -->
    <div class="daypick">
      <button id="day-N" class="on" onclick="setDay('N')">
        <span class="lab">Next</span>
        <span class="desc">Auto plan</span>
      </button>
      <button id="day-C" onclick="setDay('C')">
        <span class="lab">Custom</span>
        <span class="desc">Build your own</span>
      </button>
      <button id="day-X" onclick="setDay('X')">
        <span class="lab">Activity</span>
        <span class="desc">Run, sport…</span>
      </button>
    </div>

    <div class="planbanner" id="planbanner"></div>
    <div class="typepick" id="typepick"></div>

    <div class="meta-row">
      <span class="week" id="weeklabel">Session date</span>
      <input type="date" id="sessdate" class="datefield" onchange="onDateChange()">
    </div>

    <div id="exlist"></div>
  </section>

  <!-- PROGRESS section (unchanged) -->
  <section id="view-prog" class="hidden">
    <div id="proglist"></div>
    <div class="hist">
      <h3>Logged sessions</h3>
      <div id="histlist"></div>
      <div class="imphint" id="imphint"></div>
      <div class="databtns">
        <button class="databtn" onclick="openExport()">⤓ Export backup</button>
        <button class="databtn" onclick="openImport()">⤒ Import backup</button>
      </div>
      <button class="reset" id="resetbtn" onclick="resetAll()">Reset all data</button>
      <div class="buildtag">Iron.Log · build 2026-06-23 · v4.1</div>
    </div>
  </section>
</div>

<!-- Modals and savebar (unchanged) -->
<div class="modal" id="datamodal" onclick="if(event.target===this)closeData()">
  <div class="modal-card" id="datamodal-card"></div>
</div>
<div class="modal" id="infomodal" onclick="if(event.target===this)closeInfo()">
  <div class="modal-card" id="infomodal-card"></div>
</div>

<div class="savebar" id="savebar">
  <div class="inner">
    <button class="btn btn-ghost" onclick="clearInputs()">Clear</button>
    <button class="btn btn-primary" onclick="saveSession()">Log session</button>
  </div>
</div>

<div class="toast" id="toast">Logged</div>
<div class="resttimer" id="resttimer" onclick="stopRest()"></div>
<div class="modal" id="recap" onclick="if(event.target===this)closeRecap()">
  <div class="modal-card" id="recap-card"></div>
</div>

<script>
// === YOUR ORIGINAL CODE WITH FIXES APPLIED ===

if(!window.storage){
  window.storage = {
    get:    async (k)   => { try{ const v = localStorage.getItem(k); return v==null ? null : {value:v}; }catch(e){ return null; } },
    set:    async (k,v) => { try{ localStorage.setItem(k, v); }catch(e){} return {value:v}; },
    delete: async (k)   => { try{ localStorage.removeItem(k); }catch(e){} return {deleted:true}; },
  };
}

// === KEY FIXES ===

const EXDEF = {};
LIBRARY.forEach(e=>{
  e.sets = e.sets || 3;
  e.reps = `${e.sets} × \( {e.lo} \){e.hi!==e.lo?'–'+e.hi:''}`;
  EXDEF[e.id] = e;
});

const CAND = {};
LIBRARY.forEach(e=>{ (CAND[e.cat]=CAND[e.cat]||[]).push(e.id); });
Object.values(CAND).forEach(arr=> arr.sort((a,b)=> ROLE_RANK[EXDEF[a].role]-ROLE_RANK[EXDEF[b].role]));

// ── FIXED PRIORITIES ─────────────────────────────────────
CAND.hinge = ['dead', 'trapdl', 'rdl', 'goodmorn', 'hipthrust']; // Deadlifts lead!

  // Reduce hinge-lead frequency
  if (lowerLead === 'hinge' && Math.random() < 0.65) {
    lowerLead = 'knee';
  }

  // ... rest of the plan building logic remains the same
}
