// read the set rows currently entered for one lift card
function readCardSets(ex){
  const sets = [];
  document.querySelectorAll(`#exlist .setrows[data-rows="${ex.id}"] .set`).forEach(row=>{
    let w = parseFloat(row.querySelector('input[data-f="w"]').value);
    const r = parseInt(row.querySelector('input[data-f="r"]').value);
    if(ex.bw && (isNaN(w) || w<0)) w = 0;
    const okW = ex.bw ? (w>=0) : (!isNaN(w) && w>0);
    if(okW && !isNaN(r) && r>0) sets.push(row.classList.contains('wu') ? {w, r, wu:true} : {w, r});
  });
  return sets;
}

function ensureDraft(){
  if(activeDraft) return activeDraft;
  const date = document.getElementById('sessdate').value || todayStr();
  const label = currentDay==='N' ? (currentPlanTitle || 'Session') : 'Custom';
  activeDraft = { id:Date.now(), date, day:label, mode:currentDay,
                  slot: (currentDay==='N' && currentPlanType==='auto') ? currentPlanSlot : null,
                  plan: workList.map(e=>e.id), entries:{}, effort:{}, draft:true };
  sessions.push(activeDraft);
  return activeDraft;
}

// save one lift right away (persists immediately)
async function saveLift(exId){
  const ex = workList.find(e=>e.id===exId);
  if(!ex) return;
  const sets = readCardSets(ex);
  if(!sets.length){ toast('Enter a set first'); return; }
  const d = ensureDraft();
  d.entries[exId] = sets;
  d.effort = d.effort || {};
  if(pendingEffort[exId]) d.effort[exId] = pendingEffort[exId];
  d.plan = workList.map(e=>e.id);
  d.date = document.getElementById('sessdate').value || d.date;
  await persist();
  const card = document.querySelector(`#exlist .ex[data-card="${exId}"]`);
  if(card) card.classList.add('saved');
  const btn = document.getElementById('sv-'+exId);
  if(btn){ btn.classList.add('done'); btn.textContent = '✓ Saved'; }
  toast(`${ex.name} saved`);
}

// ── Post-session feedback ───────────────────────────────────────────────────
// best working set: highest estimated 1RM (so 60 × 8 beats a heavier single), or most reps for bodyweight
function topOf(sets, bw){
  const ws = workSets(sets);
  return bw
    ? ws.reduce((m,s)=> (s.r>m.r || (s.r===m.r && s.w>m.w)) ? s : m, ws[0])
    : ws.reduce((m,s)=>{ const e=epley(s.w,s.r), em=epley(m.w,m.r); return (e>em || (e===em && s.w>m.w)) ? s : m; }, ws[0]);
}
function buildFeedback(sess){
  const earlier = s => (s.date < sess.date) || (s.date===sess.date && s.id < sess.id);
  const prior = sessions.filter(s=> s!==sess && s.kind!=='activity' && s.entries && earlier(s))
                        .sort((a,b)=> b.date.localeCompare(a.date) || b.id-a.id);
  let totalSets=0, totalVol=0, prs=0, cleared=0, withTarget=0, newCount=0, below=0;
  const lifts=[]; const stalls=[]; const groups=new Set(); let jump=null;
  const GROUP = {knee:'legs',hinge:'legs',calf:'legs',hpush:'push',vpush:'push',hpull:'pull',vpull:'pull',biceps:'arms',triceps:'arms',core:'core'};
  Object.keys(sess.entries).forEach(id=>{
    const ex = EXDEF[id] || {id, name:getName(id)};
    const sets = workSets(sess.entries[id]);
    totalSets += sets.length;
    sets.forEach(s=> totalVol += (s.w||0)*s.r);
    if(PATTERN[id]) groups.add(GROUP[PATTERN[id]]);
    const cur = topOf(sets, ex.bw);
    let bestPrev=0, bestPrevR=0;
    prior.forEach(s=>{ if(s.entries[id]) workSets(s.entries[id]).forEach(st=>{ if(st.w>bestPrev)bestPrev=st.w; if(st.r>bestPrevR)bestPrevR=st.r; }); });
    const prevSess = prior.find(s=> s.entries[id] && s.entries[id].length);
    let dir='new', text='first time logged — baseline';
    if(prevSess){
      const prev = topOf(prevSess.entries[id], ex.bw);
      // A planned back-off after weeks away isn't a regression — don't score it as one.
      const backFrom = Math.round((new Date(sess.date+'T00:00:00') - new Date(prevSess.date+'T00:00:00'))/86400000);
      const afterBreak = backFrom >= 12;
      if(ex.bw){
        if(cur.w>prev.w){ dir='up'; text=`▲ +${fmt(cur.w-prev.w)} kg added`; }
        else if(cur.r>prev.r){ dir='up'; text=`▲ +${cur.r-prev.r} reps (${cur.r})`; }
        else if(afterBreak){ dir='same'; text=`back after ${offLabel(backFrom)} — baseline reset`; }
        else if(cur.r<prev.r){ dir='down'; text=`▼ ${cur.r-prev.r} reps`; }
        else { dir='same'; text=`held ${cur.r} reps`; }
        if(cur.w>bestPrev || (cur.w===bestPrev && cur.r>bestPrevR)) prs++;
      } else {
        const dw = cur.w-prev.w;
        if(afterBreak && dw<=0){ dir='same'; text=`back after ${offLabel(backFrom)} — baseline reset`; }
        else if(dw>0){ dir='up'; text=`▲ +${fmt(dw)} kg → ${fmt(cur.w)}`; }
        else if(dw<0){ dir='down'; text=`▼ ${fmt(-dw)} kg`; }
        else {
          const dr = cur.r-prev.r;
          if(dr>0){ dir='up'; text=`▲ +${dr} reps @ ${fmt(cur.w)} kg`; }
          else if(dr<0){ dir='down'; text=`▼ ${-dr} reps`; }
          else { dir='same'; text=`held ${fmt(cur.w)} kg × ${cur.r}`; }
        }
        if(Math.max(...sets.map(x=> x.w||0))>bestPrev) prs++;
        if(!afterBreak && cur.w===prev.w && cur.r<=prev.r) stalls.push(ex.name);
      }
    }
    if(dir==='new') newCount++;
    if(EXDEF[id]){
      withTarget++;
      const lo = effLo(ex), hi = effHi(ex);
      const heavy = Math.max(...sets.map(s=> s.w||0));
      const repsTop = ex.bw ? cur.r : Math.min(...sets.filter(s=>s.w===heavy).map(s=>s.r));
      if(repsTop >= hi) cleared++;
      else if(repsTop < lo) below++;
      // a weight jump that dropped reps below the target floor
      if(!ex.bw && !jump){
        for(let i=1;i<sets.length;i++){
          if(sets[i].w > sets[i-1].w && sets[i].r < lo){ jump = {name:ex.name, w:sets[i].w, r:sets[i].r}; break; }
        }
      }
    }
    lifts.push({name:ex.name, dir, text});
  });

  const notes=[];
  if(prs>0) notes.push(`${prs} personal best${prs>1?'s':''} today — strong work.`);
  if(newCount) notes.push(`${newCount} of ${withTarget||newCount} lift${(withTarget||newCount)>1?'s':''} logged for the first time — baselines set, so you'll see progress against them from next session.`);
  if(withTarget && !(cleared===0 && newCount===withTarget))
    notes.push(`You cleared the top of the rep range on ${cleared} of ${withTarget} lift${withTarget>1?'s':''}${cleared?' — those step up in weight next time':''}.`);
  if(withTarget && below >= Math.ceil(withTarget/2))
    notes.push(`Most of your top sets landed below the target rep range — the weight may be a touch heavy on those. Easing it slightly to hit the full reps will drive better progress.`);
  if(jump) notes.push(`${jump.name}: the jump to ${fmt(jump.w)} kg dropped you to ${jump.r} reps — smaller increments will keep your reps in the target range.`);
  if(stalls.length) notes.push(`${stalls.slice(0,2).join(' and ')} held flat — keep the weight and chase reps, or take a lighter week if it lingers.`);
  if(groups.size>=3){
    const order=['legs','push','pull','arms','core']; const g=order.filter(x=> groups.has(x));
    notes.push(`Covered ${g.slice(0,-1).join(', ')} and ${g[g.length-1]} — a well-balanced full-body session.`);
  }
  const liftSorted = sessions.filter(s=> s.kind!=='activity' && s.entries).sort((a,b)=> b.date.localeCompare(a.date)||b.id-a.id);
  let noLeg=0;
  for(const s of liftSorted){ const hasLeg=Object.keys(s.entries).some(id=> ['knee','hinge','calf'].includes(PATTERN[id])); if(hasLeg) break; noLeg++; }
  if(noLeg>=2) notes.push(`That's ${noLeg} sessions without legs — a lower-body day is due.`);

  // Lead with the return-to-training framing so the numbers read correctly.
  const firstPrior = prior.find(s=> s.entries && Object.keys(s.entries).length);
  if(firstPrior){
    const sg = Math.round((new Date(sess.date+'T00:00:00') - new Date(firstPrior.date+'T00:00:00'))/86400000);
    if(sg >= 14){
      const acts = sessions.filter(s=> s.kind==='activity' && s.date > firstPrior.date && s.date <= sess.date);
      const kept = acts.length ? ` The ${[...new Set(acts.map(a=>a.activity))].join(' and ').toLowerCase()} in between kept your engine going, which is why the legs came back faster than the pressing.` : '';
      notes.unshift(`First session back after ${offLabel(sg)}. Today is a reset point, not a regression — strength returns far faster than it was built, so expect to be near your old lifts within two or three sessions.${kept}`);
    }
  }

  return { volume: Math.round(totalVol), sets: totalSets, prs, lifts, notes: notes.slice(0,5) };
}

function showRecap(fb, sess){
  const d = new Date(sess.date+'T00:00:00');
  const dstr = isNaN(d) ? sess.date : d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'});
  const liftsHTML = fb.lifts.map(l=> `<div class="rc-lift"><span>${l.name}</span><span class="rc-${l.dir}">${l.text}</span></div>`).join('');
  const notesHTML = fb.notes.map(n=> `<div class="rc-note">${n}</div>`).join('');
  document.getElementById('recap-card').innerHTML = `
    <div class="rc-h">Session<span class="x">.</span> done</div>
    <div class="rc-sub">${sess.day} · ${dstr}</div>
    <div class="rc-stats">
      <div><div class="rc-n">${fb.volume.toLocaleString()}</div><div class="rc-k">kg volume</div></div>
      <div><div class="rc-n">${fb.sets}</div><div class="rc-k">sets</div></div>
      <div><div class="rc-n" style="${fb.prs?'color:var(--amber)':''}">${fb.prs}</div><div class="rc-k">PRs</div></div>
    </div>
    <div class="rc-lifts">${liftsHTML}</div>
    ${notesHTML ? `<div class="rc-notes">${notesHTML}</div>` : ''}
    <button class="btn btn-primary" onclick="closeRecap()">Done</button>`;
  document.getElementById('recap').classList.add('show');
}
function closeRecap(){ document.getElementById('recap').classList.remove('show'); }

async function saveSession(){
  const date = document.getElementById('sessdate').value || todayStr();

  if(currentDay === 'X'){                                   // activity log
    let activity = document.getElementById('act-type').value;
    if(activity==='Other'){ activity = (document.getElementById('act-custom').value||'').trim() || 'Activity'; }
    const dur = parseInt(document.getElementById('act-dur').value);
    const dist = parseFloat(document.getElementById('act-dist').value);
    const intensity = document.getElementById('act-int').value;
    const note = (document.getElementById('act-note').value||'').trim();
    if(isNaN(dur) || dur<=0){ toast('Enter a duration'); return; }
    sessions.push({ id:Date.now(), date, kind:'activity', activity,
      durationMin:dur, distanceKm:isNaN(dist)?null:dist, intensity:intensity||null, note });
    await persist();
    scheduleSync();
    renderProgress();
    setDay('N');
    toast(`${activity} logged`);
    return;
  }

  // sweep every card into the draft (captures anything not individually saved)
  const d = ensureDraft();
  d.date = date;
  workList.forEach(ex=>{
    const sets = readCardSets(ex);
    if(sets.length) d.entries[ex.id] = sets;
  });
  if(!Object.keys(d.entries).length){
    sessions = sessions.filter(s=> s!==d); activeDraft=null;
    toast('Add a lift and enter a set'); return;
  }
  // finalise
  d.effort = d.effort || {};
  Object.keys(pendingEffort).forEach(id=>{
    if(!d.entries[id]) return;
    if(pendingEffort[id]) d.effort[id] = pendingEffort[id]; else delete d.effort[id];
  });
  if(currentDay==='N' && currentPlanType==='auto') d.slot = currentPlanSlot;
  d.day = currentDay==='N' ? (currentPlanTitle || 'Session') : 'Custom';
  delete d.draft;
  const fb = buildFeedback(d);     // compare against history before clearing
  d.recap = fb;
  activeDraft = null;
  await persist();
  scheduleSync();

  renderProgress();
  setDay('N');                       // roll forward to the next programmed session
  showRecap(fb, d);
}

function switchTab(t){
  const train = t==='train';
  document.getElementById('view-train').classList.toggle('hidden', !train);
  document.getElementById('view-prog').classList.toggle('hidden', train);
  document.getElementById('savebar').classList.toggle('hidden', !train);
  document.getElementById('tab-train').classList.toggle('on', train);
  document.getElementById('tab-prog').classList.toggle('on', !train);
  if(!train) renderProgress();
}

function spark(points){
  if(points.length<2) return '';
  const w=300,h=54,pad=6;
  const xs=points.map((_,i)=>i), ys=points.map(p=>p);
  const minY=Math.min(...ys), maxY=Math.max(...ys);
  const rng=(maxY-minY)||1;
  const X=i=> pad + (i/(points.length-1))*(w-2*pad);
  const Y=v=> h-pad - ((v-minY)/rng)*(h-2*pad);
  let d='';
  points.forEach((p,i)=>{ d += (i?' L':'M')+X(i).toFixed(1)+' '+Y(p).toFixed(1); });
  const lastX=X(points.length-1), lastY=Y(points[points.length-1]);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <path d="${d}" fill="none" stroke="var(--amber)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="3.5" fill="var(--amber)"/>
  </svg>`;
}

function renderProgress(){
  const wrap = document.getElementById('proglist');
  const done = doneSessions();
  const allIds = [...new Set([...Object.keys(EXDEF), ...done.flatMap(s=> Object.keys(s.entries||{}))])];
  let html='', any=false;
  allIds.forEach(id=>{
    const bw = !!(EXDEF[id] && EXDEF[id].bw);
    const series = seriesFor(id);
    if(!series.length) return;
    any = true;
    // Bodyweight: chart reps until you add load, then added kg. Weighted: estimated 1RM,
    // which credits extra reps as well as extra weight.
    const loaded = bw && series.some(p=> p.w>0);
    const byReps = bw && !loaded;
    const val = p => byReps ? p.r : bw ? p.w : p.e;
    const unit = byReps ? ' reps' : ' kg';
    const cur = series[series.length-1];
    const best = series.reduce((m,x)=> val(x)>val(m)?x:m, series[0]);
    let delta='';
    if(series.length>1){
      const diff = val(cur) - val(series[series.length-2]);
      const what = (!bw) ? ' est. 1RM' : '';
      if(diff>0.05) delta=`<span class="delta up">▲ +${fmt(diff)}${unit}${what} vs last</span>`;
      else if(diff<-0.05) delta=`<span class="delta flat">▼ ${fmt(diff)}${unit}${what} vs last</span>`;
      else delta=`<span class="delta flat">— held</span>`;
    }
    const topTxt = byReps ? `${cur.r}<small> reps</small>`
                 : bw ? `+${fmt(cur.w)}<small> ×${cur.r}</small>`
                 : `${fmt(cur.w)}<small> ×${cur.r}</small>`;
    const k2 = bw ? 'Best' : 'Est. 1RM';
    const v2 = byReps ? `${best.r}<small> reps</small>` : bw ? `+${fmt(best.w)}<small> kg</small>` : `${fmt(cur.e)}<small> kg</small>`;
    html += `<div class="pex">
      <div class="pex-top">
        <h3 class="pex-name">${getName(id)}</h3>
        <div class="pstats">
          <div class="stat"><div class="k">Top set</div><div class="v">${topTxt}</div></div>
          <div class="stat"><div class="k">${k2}</div><div class="v">${v2}</div></div>
        </div>
      </div>
      ${spark(series.map(val))}
      ${delta||'<span class="delta flat">First entry — baseline set</span>'}
    </div>`;
  });
  wrap.innerHTML = any ? html : '<div class="empty">No sessions logged yet. Log your first one in the Train tab and your numbers will start tracking here.</div>';
  const hint = document.getElementById('imphint');
  if(hint){
    if(!sessions.length){ hint.classList.add('show'); hint.innerHTML = `Starting fresh? If you logged workouts in an earlier version, tap <b>Import backup</b> below to restore them.`; }
    else hint.classList.remove('show');
  }
  renderHistory();
}

function renderHistory(){
  const wrap = document.getElementById('histlist');
  if(!sessions.length){ wrap.innerHTML='<div class="empty">Nothing logged yet.</div>'; return; }
  const sorted = [...sessions].sort((a,b)=> b.date.localeCompare(a.date) || b.id-a.id);
  wrap.innerHTML = sorted.map(s=>{
    const d = new Date(s.date+'T00:00:00');
    const dstr = isNaN(d) ? s.date : d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});

    if(s.kind==='activity'){
      const bits = [`${s.durationMin} min`];
      if(s.distanceKm) bits.push(`${fmt(s.distanceKm)} km`);
      if(s.intensity) bits.push(s.intensity.toLowerCase());
      const note = s.note ? `<div class="hx"><span class="hx-n" style="color:var(--muted)">${s.note}</span></div>` : '';
      return `<div class="hitem">
        <div class="hrow act">
          <div class="hd"><b>${s.activity}</b> · ${bits.join(' · ')}<div class="dt">${dstr} · activity</div></div>
          <button class="del" onclick="delSession(${s.id})">Delete</button>
        </div>
        ${note ? `<div class="hdetail open">${note}</div>` : ''}
      </div>`;
    }

    const ids = s.entries ? Object.keys(s.entries) : [];
    const label = (s.day==='A'||s.day==='B') ? `Day ${s.day}` : (s.day || 'Session');
    const detail = ids.length ? ids.map(id=>{
      const ex = EXDEF[id];
      const arr = Array.isArray(s.entries[id]) ? s.entries[id] : [];
      const setsTxt = arr.map(st=>{
        const w = (ex && ex.bw && st.w===0) ? 'BW' : fmt(st.w)+' kg';
        return `${w} × ${st.r}${st.wu?'<span style="color:var(--muted-dim)"> w</span>':''}`;
      }).join('   ');
      const eff = s.effort && s.effort[id] ? `<span style="color:var(--muted-dim);font-size:11px"> · ${s.effort[id]}</span>` : '';
      return `<div class="hx"><span class="hx-n">${getName(id)}${eff}</span><span class="hx-s">${setsTxt}</span></div>`;
    }).join('') : '<div class="hx"><span class="hx-n" style="color:var(--muted-dim)">No exercise detail recorded for this session</span></div>';
    let recap = '';
    if(ids.length){
      const r = buildFeedback(s);
      const notes = (r.notes||[]).map(n=> `<div class="hrecap-note">${n}</div>`).join('');
      recap = `<div class="hrecap"><span>${(r.volume||0).toLocaleString()} kg · ${r.sets} sets${r.prs?` · <b>${r.prs} PR${r.prs>1?'s':''}</b>`:''}</span></div>${notes}`;
    }
    return `<div class="hitem">
      <div class="hrow">
        <div class="hd"><b>${label}</b> · ${ids.length} lift${ids.length!==1?'s':''}<div class="dt">${dstr}${s.draft?' · in progress':''}</div></div>
        <button class="del" onclick="delSession(${s.id})">Delete</button>
      </div>
      <div class="hdetail open">${detail}${recap}</div>
    </div>`;
  }).join('');
}

async function resetAll(){
  const msg = syncReady()
    ? 'Delete all logged sessions? This also clears them from the GitHub copy. It cannot be undone (export a backup first if unsure).'
    : 'Delete all logged sessions? This cannot be undone.';
  if(!confirm(msg)) return;
  const now = Date.now();
  sessions.forEach(s=>{ if(!s.draft) TOMB[s.id] = now; });
  sessions = [];
  activeDraft = null;
  await persist(); scheduleSync();
  workList = [];
  renderProgress();
  setDay('N');
  toast('All data cleared');
}

async function delSession(id){
  const s = sessions.find(x=> x.id===id);
  if(activeDraft && activeDraft.id===id) activeDraft = null;
  if(s && !s.draft) TOMB[id] = Date.now();
  sessions = sessions.filter(s=> s.id!==id);
  await persist(); scheduleSync();
  renderProgress();
  if(currentDay==='N') buildAutoPlan();
  renderTrain();
}

// ── Backup: export / import ─────────────────────────────────────────────────
function exportPayload(){
  return JSON.stringify({ app:'IronLog', version:2, exported:new Date().toISOString(),
    sessions, names:NAMES_REG, prefs:PREFS, block:BLOCK, tombstones:TOMB }, null, 0);
}
function closeData(){ document.getElementById('datamodal').classList.remove('show'); }

function openExport(){
  const json = exportPayload();
  const n = sessions.filter(s=>s.kind!=='activity').length, a = sessions.length-n;
  document.getElementById('datamodal-card').innerHTML = `
    <div class="dm-h">Export backup</div>
    <div class="dm-sub">${n} workout${n!==1?'s':''}${a?` + ${a} activit${a>1?'ies':'y'}`:''}. Copy this text somewhere safe (a note to yourself), or download it. To restore later, paste it into Import.</div>
    <textarea class="dm-ta" id="dm-out" readonly>${json.replace(/</g,'&lt;')}</textarea>
    <div class="dm-row">
      <button class="btn btn-ghost" onclick="copyExport()">Copy</button>
      <button class="btn btn-ghost" onclick="downloadExport()">Download</button>
      <button class="btn btn-primary" onclick="closeData()">Done</button>
    </div>`;
  document.getElementById('datamodal').classList.add('show');
}
function copyExport(){
  const ta = document.getElementById('dm-out');
  const txt = exportPayload();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast('Backup copied')).catch(()=>{ ta.select(); try{document.execCommand('copy'); toast('Backup copied');}catch(e){toast('Select the text and copy');} });
  } else {
    ta.select(); ta.setSelectionRange(0, txt.length);
    try{ document.execCommand('copy'); toast('Backup copied'); }catch(e){ toast('Select the text and copy'); }
  }
}
function downloadExport(){
  try{
    const blob = new Blob([exportPayload()], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `ironlog-backup-${todayStr()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    toast('Backup downloaded');
  }catch(e){ toast('Use Copy instead'); }
}

function openImport(){
  document.getElementById('datamodal-card').innerHTML = `
    <div class="dm-h">Import backup</div>
    <div class="dm-sub">Paste a previously exported backup below (or choose a file), then Import. It merges with anything already here — duplicates are skipped, so it's safe.</div>
    <textarea class="dm-ta" id="dm-in" placeholder='Paste your backup text here…'></textarea>
    <input class="dm-file" type="file" accept="application/json,.json" id="dm-file" onchange="importFile(this)">
    <div class="dm-row">
      <button class="btn btn-ghost" onclick="closeData()">Cancel</button>
      <button class="btn btn-primary" onclick="doImport()">Import</button>
    </div>`;
  document.getElementById('datamodal').classList.add('show');
}
function importFile(input){
  const f = input.files && input.files[0];
  if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{ document.getElementById('dm-in').value = rd.result; };
  rd.readAsText(f);
}
async function doImport(){
  const raw = (document.getElementById('dm-in').value||'').trim();
  if(!raw){ toast('Paste a backup first'); return; }
  let data;
  try{ data = JSON.parse(raw); }catch(e){ toast('That doesn’t look like valid backup text'); return; }
  const incoming = Array.isArray(data) ? data : (data.sessions||[]);
  if(!Array.isArray(incoming) || !incoming.length){ toast('No sessions found in that backup'); return; }
  const have = new Set(sessions.map(s=>s.id));
  let added = 0;
  incoming.forEach(s=>{
    if(s && s.id!=null && !have.has(s.id)){
      if(TOMB[s.id]) s.restoredAt = Date.now();          // restoring something deleted earlier
      sessions.push(s); have.add(s.id); added++;
    }
  });
  if(data && data.names) NAMES_REG = Object.assign({}, data.names, NAMES_REG);
  if(data && data.prefs && (!PREFS.updated || (data.prefs.updated||0) > PREFS.updated)){ PREFS = data.prefs; PREFS.inc = PREFS.inc || {}; }
  if(data && data.block && (!BLOCK || !BLOCK.updated || (data.block.updated||0) > BLOCK.updated)) BLOCK = data.block;
  activeDraft = sessions.find(s=> s.draft) || null;
  await persist(); scheduleSync();
  closeData();
  renderProgress();
  setDay('N');
  toast(`Imported — ${added} new session${added!==1?'s':''} added`);
}

// ── GitHub sync ─────────────────────────────────────────────────────────────
// Keeps your log as a JSON file in a GitHub repo. Pull → merge → push, so PC and
// phone converge: sessions are unioned by id, deletions travel as tombstones,
// block and weight-step settings go to whichever was changed most recently.
function syncReady(){ return !!(SYNC && SYNC.owner && SYNC.repo && SYNC.token && SYNC.path); }
function ghUrl(){
  return `https://api.github.com/repos/${encodeURIComponent(SYNC.owner)}/${encodeURIComponent(SYNC.repo)}/contents/`
       + SYNC.path.split('/').filter(Boolean).map(encodeURIComponent).join('/');
}
function ghHeaders(raw){ return {'Authorization':'Bearer '+SYNC.token, 'Accept': raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json'}; }
function ghFail(status){
  const e = new Error('HTTP '+status); e.status = status;
  e.friendly = status===401 ? 'token rejected — check it hasn\u2019t expired'
             : status===403 ? 'token can\u2019t write to that repo'
             : status===404 ? 'repo or branch not found'
             : (status===409||status===422) ? 'conflict — try again'
             : `GitHub error ${status}`;
  return e;
}
function b64enc(str){ const b = new TextEncoder().encode(str); let bin=''; for(let i=0;i<b.length;i+=8192) bin += String.fromCharCode(...b.subarray(i,i+8192)); return btoa(bin); }
function b64dec(b64){ const bin = atob(b64.replace(/\s/g,'')); return new TextDecoder().decode(Uint8Array.from(bin, c=> c.charCodeAt(0))); }
function stable(v){
  if(Array.isArray(v)) return '['+v.map(stable).join(',')+']';
  if(v && typeof v==='object') return '{'+Object.keys(v).sort().filter(k=> v[k]!==undefined).map(k=> JSON.stringify(k)+':'+stable(v[k])).join(',')+'}';
  return JSON.stringify(v===undefined ? null : v);
}
function syncPayload(){
  return { app:'IronLog', version:2, sessions: doneSessions().slice().sort((a,b)=> a.id-b.id),
           names: NAMES_REG, prefs: PREFS, block: BLOCK, tombstones: TOMB };
}
function canonRemote(d){
  return { app:'IronLog', version:2, sessions:(d.sessions||[]).filter(s=> s && !s.draft).slice().sort((a,b)=> a.id-b.id),
           names:d.names||{}, prefs:d.prefs||{inc:{},updated:0}, block:d.block||null, tombstones:d.tombstones||{} };
}
function isDead(s){ const t = TOMB[s.id]; return !!t && t > (s.restoredAt||0); }
function mergeRemote(data){
  if(!data || !Array.isArray(data.sessions)) return false;
  const before = stable(syncPayload());
  const rt = data.tombstones || {};
  Object.keys(rt).forEach(k=>{ if(!TOMB[k] || rt[k] > TOMB[k]) TOMB[k] = rt[k]; });
  const idx = new Map(sessions.map((s,i)=> [s.id, i]));
  data.sessions.forEach(r=>{
    if(!r || r.id==null || r.draft) return;
    if(!idx.has(r.id)){ sessions.push(r); idx.set(r.id, sessions.length-1); }
    else { const l = sessions[idx.get(r.id)]; if(!l.draft && (r.restoredAt||0) > (l.restoredAt||0)) sessions[idx.get(r.id)] = r; }
  });
  sessions = sessions.filter(s=> s.draft || !isDead(s));
  if(data.names) NAMES_REG = Object.assign({}, data.names, NAMES_REG);
  if(data.prefs && (!PREFS.updated || (data.prefs.updated||0) > PREFS.updated)){ PREFS = data.prefs; PREFS.inc = PREFS.inc || {}; }
  if(data.block && data.block.A && (!BLOCK || !BLOCK.updated || (data.block.updated||0) > BLOCK.updated)) BLOCK = data.block;
  return stable(syncPayload()) !== before;
}
async function ghGet(){
  const url = ghUrl() + '?ref=' + encodeURIComponent(SYNC.branch||'main');
  const r = await fetch(url, {headers: ghHeaders(false), cache:'no-store'});
  if(r.status===404) return {data:null, sha:null};
  if(!r.ok) throw ghFail(r.status);
  const j = await r.json();
  let text = j.content ? b64dec(j.content) : '';
  if(!text && j.size > 0){                      // over 1 MB: fetch the raw file instead
    const r2 = await fetch(url, {headers: ghHeaders(true), cache:'no-store'});
    if(!r2.ok) throw ghFail(r2.status);
    text = await r2.text();
  }
  let data = null;
  if(text){ try{ data = JSON.parse(text); }catch(e){ const x = new Error('bad file'); x.friendly = 'the file in GitHub isn\u2019t Iron.Log data'; throw x; } }
  return {data, sha: j.sha};
}
async function ghPut(payload, sha){
  const body = { message:`Iron.Log sync · ${new Date().toISOString().slice(0,16).replace('T',' ')}`,
                 content: b64enc(JSON.stringify(payload, null, 1)), branch: SYNC.branch||'main' };
  if(sha) body.sha = sha;
  const r = await fetch(ghUrl(), {method:'PUT', headers:{...ghHeaders(false), 'Content-Type':'application/json'}, body:JSON.stringify(body), cache:'no-store'});
  if(!r.ok) throw ghFail(r.status);
}
let syncing = false, syncAgain = false, syncTimer = null;
function scheduleSync(){
  if(!syncReady()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(()=> syncNow(false), 1500);
}
async function syncNow(manual){
  if(!syncReady()){ if(manual) toast('Set up GitHub sync first'); return; }
  if(syncing){ syncAgain = true; return; }
  syncing = true; updateSyncStatus('Syncing…');
  try{
    for(let attempt=0; attempt<3; attempt++){
      const {data, sha} = await ghGet();
      if(mergeRemote(data)){ await persist(); refreshAfterSync(); }
      const payload = syncPayload();
      if(data && stable(canonRemote(data)) === stable(payload)) break;     // already identical — no commit
      try{ await ghPut(payload, sha); break; }
      catch(e){ if((e.status===409 || e.status===422) && attempt<2) continue; throw e; }
    }
    SYNC.last = new Date().toISOString(); SYNC.err = null;
    if(manual) toast('Synced with GitHub');
  }catch(e){
    SYNC.err = e.friendly || (e instanceof TypeError ? 'no connection' : (e.message || 'failed'));
    if(manual) toast('Sync failed — ' + SYNC.err);
  }finally{
    syncing = false;
    try{ await window.storage.set(SKEY, JSON.stringify(SYNC)); }catch(e){}
    updateSyncStatus();
    if(syncAgain){ syncAgain = false; setTimeout(()=> syncNow(false), 500); }
  }
}
function refreshAfterSync(){
  renderProgress();
  const typed = [...document.querySelectorAll('#exlist input')].some(i=> i.value);
  if(currentDay==='N' && !activeDraft && !typed){ buildAutoPlan(); renderTrain(); }
}
function updateSyncStatus(busy){
  const el = document.getElementById('syncstat');
  if(!el) return;
  el.classList.toggle('err', !!(SYNC && SYNC.err) && !busy);
  if(!syncReady()){ el.textContent = 'GitHub sync is off — your log lives on this device only.'; return; }
  if(busy){ el.textContent = busy; return; }
  const when = SYNC.last ? new Date(SYNC.last).toLocaleString(undefined,{weekday:'short',hour:'numeric',minute:'2-digit'}) : 'not yet';
  el.textContent = `Synced to ${SYNC.owner}/${SYNC.repo} · last ${when}` + (SYNC.err ? ` · last attempt failed: ${SYNC.err}` : '');
}
function escA(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function openSync(){
  const c = SYNC || {branch:'main', path:'ironlog-data.json'};
  const fld = (id,l,v,ph,type)=> `<label class="fld syfld"><span class="fld-l">${l}</span><input id="${id}" type="${type||'text'}" value="${escA(v)}" placeholder="${escA(ph)}" autocapitalize="off" autocomplete="off" spellcheck="false"></label>`;
  document.getElementById('datamodal-card').innerHTML = `
    <div class="dm-h">GitHub sync</div>
    <div class="dm-sub">Saves your log to a JSON file in a GitHub repo after every session and pulls it when the app opens, so your PC and phone stay in step. Use a <b>private</b> repo, and a fine-grained token limited to that one repo with <b>Contents: Read and write</b>. The token stays on this device.</div>
    ${fld('sy-owner','Owner (your GitHub username)',c.owner,'e.g. mhancock')}
    ${fld('sy-repo','Repository',c.repo,'e.g. ironlog-data')}
    <div class="fld-row">${fld('sy-branch','Branch',c.branch||'main','main')}${fld('sy-path','File',c.path||'ironlog-data.json','ironlog-data.json')}</div>
    ${fld('sy-token','Token', '', c.token ? '•••••••• saved — leave blank to keep' : 'github_pat_…', 'password')}
    <div class="dm-row">
      ${SYNC ? '<button class="btn btn-ghost" onclick="disconnectSync()">Turn off</button>' : ''}
      <button class="btn btn-ghost" onclick="closeData()">Cancel</button>
      <button class="btn btn-primary" onclick="saveSyncCfg()">Save &amp; sync</button>
    </div>`;
  document.getElementById('datamodal').classList.add('show');
}
async function saveSyncCfg(){
  const v = id => (document.getElementById(id).value||'').trim();
  const cfg = { owner:v('sy-owner'), repo:v('sy-repo'), branch:v('sy-branch')||'main',
                path:(v('sy-path')||'ironlog-data.json').replace(/^\/+/,''), token: v('sy-token') || (SYNC && SYNC.token) || '' };
  if(!cfg.owner || !cfg.repo || !cfg.token){ toast('Owner, repo and token are needed'); return; }
  SYNC = Object.assign({}, cfg, {last: SYNC && SYNC.repo===cfg.repo ? SYNC.last : null, err:null});
  try{ await window.storage.set(SKEY, JSON.stringify(SYNC)); }catch(e){}
  closeData();
  syncNow(true);
}
async function disconnectSync(){
  SYNC = null;
  try{ await window.storage.delete(SKEY); }catch(e){}
  closeData(); updateSyncStatus(); toast('GitHub sync turned off');
}

let toastT;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastT);
  toastT=setTimeout(()=>el.classList.remove('show'),1800);
}

// init
(async function(){
  document.getElementById('sessdate').value = todayStr();
  await loadSessions();
  ensureBlock();
  // resume an in-progress (draft) session if one exists
  const draft = sessions.find(s=> s.draft);
  if(draft){
    activeDraft = draft;
    currentDay = draft.mode || 'C';
    currentPlanTitle = draft.day || '';
    currentPlanSlot = draft.slot || null;
    pendingEffort = Object.assign({}, draft.effort || {});
    ['N','C','X'].forEach(x=> document.getElementById('day-'+x).classList.toggle('on', currentDay===x));
    document.getElementById('planbanner').classList.add('hidden');
    document.getElementById('sessdate').value = draft.date;
    const ids = (draft.plan && draft.plan.length) ? draft.plan : Object.keys(draft.entries);
    workList = ids.map(id=> EXDEF[id] || {id, name:getName(id), sets:3});
    renderTrain();
    toast('Resumed your in-progress session');
  } else {
    setDay('N');
  }
  updateSyncStatus();
  if(syncReady()) syncNow(false);
  window.addEventListener('online', scheduleSync);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') scheduleSync(); });
})();
</script>
